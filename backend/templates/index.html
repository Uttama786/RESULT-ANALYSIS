                    {/* --- Analytics and Results Section (Revealed on Complete!) --- */}
                    {analysisResults && (
                        <div class="animate-fadeIn transition-opacity duration-1000 mt-12">
                            <hr class="border-white/5 mb-10" />

                            <h2 class="text-2xl font-extrabold tracking-tight text-white mb-6 flex items-center gap-3">
                                <span class="w-8 h-8 rounded-lg bg-brandGreen/10 border border-brandGreen/20 text-brandGreen flex items-center justify-center">
                                    📊
                                </span>
                                ANALYTICAL REPORT SUMMARY
                            </h2>

                            {/* KPI metrics row */}
                            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-7 gap-3 mb-8">
                                <div class="glass-panel p-4 rounded-2xl border-l-4 border-brandPrimary shadow-md">
                                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Total Registered</p>
                                    <h4 class="text-2xl font-extrabold text-white">{analysisResults.summary.total_registered || analysisResults.summary.total_students}</h4>
                                    <p class="text-[9px] text-gray-500 font-medium mt-1">Selected USN count</p>
                                </div>
                                <div class="glass-panel p-4 rounded-2xl border-l-4 border-brandCyan shadow-md">
                                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Appeared</p>
                                    <h4 class="text-2xl font-extrabold text-brandCyan">{analysisResults.summary.appeared_count ?? (analysisResults.summary.total_students - (analysisResults.summary.absent_count || 0))}</h4>
                                    <p class="text-[9px] text-brandCyan/80 font-medium mt-1">Attended exams</p>
                                </div>
                                <div class="glass-panel p-4 rounded-2xl border-l-4 border-brandGreen shadow-md">
                                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Passed</p>
                                    <h4 class="text-2xl font-extrabold text-brandGreen">{analysisResults.summary.passed_count}</h4>
                                    <p class="text-[9px] text-brandGreen/80 font-medium mt-1">Cleared all courses</p>
                                </div>
                                <div class="glass-panel p-4 rounded-2xl border-l-4 border-brandRed shadow-md">
                                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Failed</p>
                                    <h4 class="text-2xl font-extrabold text-brandRed">{analysisResults.summary.failed_count}</h4>
                                    <p class="text-[9px] text-brandRed/80 font-medium mt-1">Backlog students</p>
                                </div>
                                <div class="glass-panel p-4 rounded-2xl border-l-4 border-yellow-500 shadow-md">
                                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Absent</p>
                                    <h4 class="text-2xl font-extrabold text-yellow-500">{analysisResults.summary.absent_count || 0}</h4>
                                    <p class="text-[9px] text-yellow-500/80 font-medium mt-1">Did not appear</p>
                                </div>
                                <div class="glass-panel p-4 rounded-2xl border-l-4 border-brandGreen shadow-md">
                                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Pass % (Appeared)</p>
                                    <h4 class="text-2xl font-extrabold text-brandGreen">{analysisResults.summary.pass_percentage}%</h4>
                                    <p class="text-[9px] text-gray-500 font-medium mt-1">Based on appeared</p>
                                </div>
                                <div class="glass-panel p-4 rounded-2xl border-l-4 border-brandRed shadow-md">
                                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Fail % (Appeared)</p>
                                    <h4 class="text-2xl font-extrabold text-brandRed">{analysisResults.summary.fail_percentage ?? (analysisResults.summary.appeared_count ? ((analysisResults.summary.failed_count / analysisResults.summary.appeared_count) * 100).toFixed(2) : "0.00")}%</h4>
                                    <p class="text-[9px] text-gray-500 font-medium mt-1">Based on appeared</p>
                                </div>
                            </div>

                            {/* Charts Grid */}
                            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-12">
                                <div class="lg:col-span-2 glass-panel p-6 rounded-2xl">
                                    <h3 class="text-sm font-bold text-white uppercase tracking-wider mb-5 flex items-center justify-between">
                                        <span>📚 SUBJECT-WISE PERFORMANCE ANALYSIS</span>
                                        <span class="text-[10px] text-gray-400">Pass rate columns & average score line</span>
                                    </h3>
                                    <SubjectAnalyticsChart subjectData={analysisResults.subject_analysis} appTheme={theme} />
                                </div>
                                <div class="glass-panel p-6 rounded-2xl flex flex-col justify-between">
                                    <h3 class="text-sm font-bold text-white uppercase tracking-wider mb-5 text-center">
                                        ⚖️ CLASS PASS/FAIL BALANCE
                                    </h3>
                                    <div class="flex-1 flex items-center justify-center">
                                        <PassFailDonutChart summary={analysisResults.summary} appTheme={theme} />
                                    </div>
                                </div>
                            </div>

                            {/* Excel Download Panel */}
                            <div class="glass-panel p-6 rounded-3xl pulsing-border border text-center mb-12 max-w-2xl mx-auto shadow-xl shadow-brandPrimary/5">
                                <div class="w-16 h-16 bg-brandGreen/10 border border-brandGreen/20 text-brandGreen rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                                    📂
                                </div>
                                <h3 class="text-xl font-bold text-white mb-2">Download Complete Excel Report</h3>
                                <p class="text-xs text-gray-400 max-w-md mx-auto mb-6">
                                    Generated a beautiful, multi-sheet workbook containing overall details, subject analysis, topper dashboards, and colored class lists.
                                </p>
                                <a 
                                    href={`/api/download/${sessionID}`} 
                                    download
                                    class="inline-flex items-center gap-2 bg-gradient-to-r from-brandGreen to-brandCyan hover:opacity-95 rounded-xl px-8 py-3 text-sm font-bold text-white transition button-glow shadow-lg shadow-brandGreen/25 text-glow"
                                >
                                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                                    </svg>
                                    DOWNLOAD BUNDLED REPORT (.XLSX)
                                </a>
                            </div>

                            {/* Tabbed Interactive Directories */}
                            <div class="glass-panel rounded-2xl overflow-hidden shadow-lg mb-8">
                                <div class="flex flex-col md:flex-row items-center justify-between border-b border-white/5 bg-black/30 p-4 gap-4">
                                    {/* Tabs */}
                                    <div class="flex flex-wrap gap-2 w-full md:w-auto">
                                        <button 
                                            onClick={() => setActiveTab("directory")}
                                            class={`px-4 py-2 text-xs font-bold uppercase tracking-wider rounded-lg transition ${activeTab === "directory" ? 'bg-brandPrimary text-white shadow' : 'text-gray-400 hover:text-white'}`}
                                        >
                                            📁 Student Directory
                                        </button>
                                        <button 
                                            onClick={() => setActiveTab("subjects")}
                                            class={`px-4 py-2 text-xs font-bold uppercase tracking-wider rounded-lg transition ${activeTab === "subjects" ? 'bg-brandPrimary text-white shadow' : 'text-gray-400 hover:text-white'}`}
                                        >
                                            📓 Subject Metrics
                                        </button>
                                        <button 
                                            onClick={() => setActiveTab("toppers")}
                                            class={`px-4 py-2 text-xs font-bold uppercase tracking-wider rounded-lg transition ${activeTab === "toppers" ? 'bg-brandPrimary text-white shadow' : 'text-gray-400 hover:text-white'}`}
                                        >
                                            👑 Batch Toppers (Top 10)
                                        </button>
                                        <button 
                                            onClick={() => setActiveTab("backlogs")}
                                            class={`px-4 py-2 text-xs font-bold uppercase tracking-wider rounded-lg transition ${activeTab === "backlogs" ? 'bg-brandPrimary text-white shadow' : 'text-gray-400 hover:text-white'}`}
                                        >
                                            🚨 Remedial Backlogs
                                        </button>
                                    </div>

                                    {/* Quick Filters - Visible on Directory tab only */}
                                    {activeTab === "directory" && (
                                        <div class="flex flex-col md:flex-row gap-3 w-full md:w-auto items-center">
                                            {/* Search */}
                                            <input 
                                                type="text" 
                                                placeholder="Search name or USN..."
                                                value={searchTerm}
                                                onChange={(e) => setSearchTerm(e.target.value)}
                                                class="w-full md:w-48 bg-black/45 border border-white/5 focus:border-brandPrimary focus:outline-none rounded-xl px-3 py-1.5 text-xs text-white"
                                            />
                                            {/* Status Filter */}
                                            <select 
                                                value={statusFilter}
                                                onChange={(e) => setStatusFilter(e.target.value)}
                                                class="w-full md:w-36 bg-black/45 border border-white/5 focus:border-brandPrimary focus:outline-none rounded-xl px-3 py-1.5 text-xs text-white cursor-pointer"
                                            >
                                                <option value="ALL">All Records</option>
                                                <option value="PASS">Cleared Class</option>
                                                <option value="FAIL">Backlog Class</option>
                                                <option value="ABSENT">Absent Class</option>
                                                <option value="DISTINCTION">Distinction Only</option>
                                                <option value="FIRST CLASS">First Class Only</option>
                                            </select>
                                        </div>
                                    )}
                                </div>

                                <div class="p-4 sm:p-6 overflow-x-auto scrollbar-thin">
                                    {/* Directory Tab Content */}
                                    {activeTab === "directory" && (
                                        <table class="w-full text-left text-xs border-collapse">
                                            <thead>
                                                <tr class="border-b border-white/5 text-gray-400 uppercase tracking-widest font-bold whitespace-nowrap">
                                                    <th class="py-3 px-4">USN</th>
                                                    <th class="py-3 px-4">Student Name</th>
                                                    <th class="py-3 px-4 text-right">Score</th>
                                                    <th class="py-3 px-4 text-right">Percentage</th>
                                                    <th class="py-3 px-4 text-center">Class / Result</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {filteredResults.map((student, idx) => {
                                                    const isFail = student.status.includes("FAIL");
                                                    const isAbsent = student.status.includes("ABSENT") || student.status === "AB";
                                                    const isDistinction = student.status.includes("DISTINCTION");
                                                    
                                                    let statusBadge = "bg-brandGreen/10 border-brandGreen/20 text-brandGreen";
                                                    if (isFail) statusBadge = "bg-brandRed/10 border-brandRed/20 text-brandRed";
                                                    else if (isAbsent) statusBadge = "bg-yellow-500/10 border-yellow-500/20 text-yellow-500";
                                                    else if (isDistinction) statusBadge = "bg-brandCyan/10 border-brandCyan/20 text-brandCyan text-glow";

                                                    return (
                                                        <tr key={idx} class="border-b border-white/5 hover:bg-white/5 transition-all whitespace-nowrap">
                                                            <td class="py-3.5 px-4 font-mono font-bold text-gray-300">{student.usn}</td>
                                                            <td class="py-3.5 px-4 font-bold text-white uppercase">{student.name}</td>
                                                            <td class="py-3.5 px-4 text-right font-semibold text-gray-300">{student.total_marks} / {student.max_marks}</td>
                                                            <td class="py-3.5 px-4 text-right font-bold text-brandCyan font-mono">{student.percentage}%</td>
                                                            <td class="py-3.5 px-4 text-center">
                                                                <span class={`inline-block px-3 py-1 rounded-full border text-[10px] font-bold tracking-wider ${statusBadge}`}>
                                                                    {student.status}
                                                                </span>
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                                {filteredResults.length === 0 && (
                                                    <tr>
                                                        <td colspan="5" class="py-8 text-center text-gray-500 italic">No matching student records found.</td>
                                                    </tr>
                                                )}
                                            </tbody>
                                        </table>
                                    )}

                                    {/* Subject Metrics Tab Content */}
                                    {activeTab === "subjects" && (
                                        <table class="w-full text-left text-xs border-collapse">
                                            <thead>
                                                <tr class="border-b border-white/5 text-gray-400 uppercase tracking-widest font-bold whitespace-nowrap">
                                                    <th class="py-3 px-4">Subject Code</th>
                                                    <th class="py-3 px-4">Subject Name</th>
                                                    <th class="py-3 px-4 text-right">Registered</th>
                                                    <th class="py-3 px-4 text-right">Appeared</th>
                                                    <th class="py-3 px-4 text-right">Passed</th>
                                                    <th class="py-3 px-4 text-right">Failed</th>
                                                    <th class="py-3 px-4 text-right">Absent</th>
                                                    <th class="py-3 px-4 text-right">Pass Rate (%)</th>
                                                    <th class="py-3 px-4 text-right">Fail Rate (%)</th>
                                                    <th class="py-3 px-4 text-right">Average Score</th>
                                                    <th class="py-3 px-4 text-right">Highest Score</th>
                                                    <th class="py-3 px-4 text-center">Subject Topper</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {analysisResults.subject_analysis.map((sub, idx) => {
                                                    const appeared = sub.appeared ?? (sub.registered - (sub.absent || 0));
                                                    const failPct = sub.fail_percentage ?? (appeared > 0 ? ((sub.failed / appeared) * 100).toFixed(2) : "0.00");
                                                    return (
                                                        <tr key={idx} class="border-b border-white/5 hover:bg-white/5 transition-all whitespace-nowrap">
                                                            <td class="py-3.5 px-4 font-mono font-bold text-brandPrimary">{sub.code}</td>
                                                            <td class="py-3.5 px-4 font-bold text-white uppercase">{sub.name}</td>
                                                            <td class="py-3.5 px-4 text-right font-semibold text-gray-300">{sub.registered}</td>
                                                            <td class="py-3.5 px-4 text-right font-semibold text-brandCyan">{appeared}</td>
                                                            <td class="py-3.5 px-4 text-right text-brandGreen font-bold">{sub.passed}</td>
                                                            <td class="py-3.5 px-4 text-right text-brandRed font-bold">{sub.failed}</td>
                                                            <td class="py-3.5 px-4 text-right text-yellow-500 font-bold">{sub.absent || 0}</td>
                                                            <td class="py-3.5 px-4 text-right font-bold text-brandGreen font-mono">{sub.pass_percentage}%</td>
                                                            <td class="py-3.5 px-4 text-right font-bold text-brandRed font-mono">{failPct}%</td>
                                                            <td class="py-3.5 px-4 text-right text-gray-300 font-semibold">{sub.average_marks}</td>
                                                            <td class="py-3.5 px-4 text-right text-brandSecondary font-bold">{sub.highest_marks}</td>
                                                            <td class="py-3.5 px-4 text-center font-mono font-bold text-brandOrange">{sub.highest_usn}</td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    )}

                                    {/* Toppers Tab Content */}
                                    {activeTab === "toppers" && (
                                        <table class="w-full text-left text-xs border-collapse">
                                            <thead>
                                                <tr class="border-b border-white/5 text-gray-400 uppercase tracking-widest font-bold whitespace-nowrap">
                                                    <th class="py-3 px-4 text-center">Rank</th>
                                                    <th class="py-3 px-4">USN</th>
                                                    <th class="py-3 px-4">Topper Student Name</th>
                                                    <th class="py-3 px-4 text-right">Score Scored</th>
                                                    <th class="py-3 px-4 text-right">Percentage</th>
                                                    <th class="py-3 px-4 text-center">Class Merit</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {analysisResults.toppers.map((topper, idx) => {
                                                    const isRank1 = topper.rank === 1;
                                                    let rankBadge = "bg-white/5 text-gray-300 border border-white/5";
                                                    if (isRank1) rankBadge = "bg-brandOrange/10 border-brandOrange/30 text-brandOrange font-extrabold text-glow";
                                                    else if (topper.rank === 2) rankBadge = "bg-brandCyan/10 border-brandCyan/20 text-brandCyan";
                                                    else if (topper.rank === 3) rankBadge = "bg-brandSecondary/10 border-brandSecondary/20 text-brandSecondary";

                                                    return (
                                                        <tr key={idx} class="border-b border-white/5 hover:bg-white/5 transition-all whitespace-nowrap">
                                                            <td class="py-3.5 px-4 text-center">
                                                                <span class={`inline-flex w-7 h-7 rounded-full items-center justify-center text-xs ${rankBadge}`}>
                                                                    {isRank1 ? "👑" : topper.rank}
                                                                </span>
                                                            </td>
                                                            <td class="py-3.5 px-4 font-mono font-bold text-gray-300">{topper.usn}</td>
                                                            <td class="py-3.5 px-4 font-extrabold text-white uppercase flex items-center gap-2">
                                                                {topper.name}
                                                            </td>
                                                            <td class="py-3.5 px-4 text-right font-bold text-gray-300">{topper.total_marks} / {topper.max_marks}</td>
                                                            <td class="py-3.5 px-4 text-right font-bold text-brandCyan font-mono">{topper.percentage}%</td>
                                                            <td class="py-3.5 px-4 text-center">
                                                                <span class="inline-block px-3 py-1 rounded-full border border-brandPrimary/20 bg-brandPrimary/10 text-brandPrimary text-[10px] font-bold tracking-wider">
                                                                    {topper.status}
                                                                </span>
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    )}

                                    {/* Remedial List Content */}
                                    {activeTab === "backlogs" && (
                                        <table class="w-full text-left text-xs border-collapse">
                                            <thead>
                                                <tr class="border-b border-white/5 text-gray-400 uppercase tracking-widest font-bold whitespace-nowrap">
                                                    <th class="py-3 px-4">USN</th>
                                                    <th class="py-3 px-4">Student Name</th>
                                                    <th class="py-3 px-4 text-right">Aggregated Score</th>
                                                    <th class="py-3 px-4 text-right">Backlog Count</th>
                                                    <th class="py-3 px-4 text-center">Failed Subject Codes</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {analysisResults.failed_students.map((student, idx) => (
                                                    <tr key={idx} class="border-b border-white/5 hover:bg-white/5 transition-all whitespace-nowrap">
                                                        <td class="py-3.5 px-4 font-mono font-bold text-gray-300">{student.usn}</td>
                                                        <td class="py-3.5 px-4 font-bold text-white uppercase">{student.name}</td>
                                                        <td class="py-3.5 px-4 text-right font-semibold text-gray-400">{student.total_marks}</td>
                                                        <td class="py-3.5 px-4 text-right text-brandRed font-extrabold text-sm">{student.failed_subjects.length}</td>
                                                        <td class="py-3.5 px-4 text-center font-mono">
                                                            {student.failed_subjects.map((code, sIdx) => (
                                                                <span key={sIdx} class="inline-block px-2 py-0.5 bg-brandRed/10 border border-brandRed/20 rounded text-[10px] text-brandRed font-bold mr-1.5">
                                                                    {code}
                                                                </span>
                                                            ))}
                                                        </td>
                                                    </tr>
                                                ))}
                                                {analysisResults.failed_students.length === 0 && (
                                                    <tr>
                                                        <td colspan="5" class="py-8 text-center text-brandGreen font-bold italic">
                                                            🎉 Academic Excellence! 100% of students passed all registered courses successfully.
                                                        </td>
                                                    </tr>
                                                )}
                                            </tbody>
                                        </table>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer Component */}
                    <Footer 
                        onOpenGuide={() => setShowGuideModal(true)} 
                        onOpenAbout={() => setShowAboutModal(true)} 
                        onOpenFeedback={() => setShowFeedbackModal(true)}
                    />
                </div>
            );
        };

        // Render the application into root container
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
