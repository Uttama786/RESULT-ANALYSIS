<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTU Result Analysis & Crawling Hub</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS with custom styling properties -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090a0f',
                        glassBg: 'rgba(15, 17, 26, 0.7)',
                        glassBorder: 'rgba(255, 255, 255, 0.08)',
                        brandPrimary: '#6366f1', // Indigo
                        brandSecondary: '#8b5cf6', // Violet
                        brandCyan: '#06b6d4', // Cyan
                        brandGreen: '#10b981', // Emerald
                        brandRed: '#f43f5e', // Rose
                        brandOrange: '#f97316', // Orange
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS styles for premium glassmorphism and animations -->
    <style>
        body.dark-mode {
            background-color: #090a0f;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: #f3f4f6;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
        }

        body.light-mode {
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
            color: #1e293b;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
        }

        /* Glass Panels - Dark Mode */
        body.dark-mode .glass-panel {
            background: rgba(15, 18, 30, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        body.dark-mode .glass-panel-heavy {
            background: rgba(10, 12, 20, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 16px 48px 0 rgba(0, 0, 0, 0.6);
        }

        /* Glass Panels - Light Mode */
        body.light-mode .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.03);
        }

        body.light-mode .glass-panel-heavy {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(203, 213, 225, 0.9);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }

        /* Light Mode Text & Input Adjustments */
        body.light-mode h3, body.light-mode h2, body.light-mode h1 {
            color: #0f172a;
        }
        body.light-mode .text-gray-300 {
            color: #334155 !important;
        }
        body.light-mode .text-gray-400 {
            color: #64748b !important;
        }
        body.light-mode .text-white {
            color: #0f172a !important;
        }
        body.light-mode input[type="text"], 
        body.light-mode input[type="url"],
        body.light-mode select {
            background-color: #f1f5f9 !important;
            border-color: #cbd5e1 !important;
            color: #0f172a !important;
        }
        body.light-mode .bg-black\/40,
        body.light-mode .bg-black\/30,
        body.light-mode .bg-black\/20 {
            background-color: #f1f5f9 !important;
        }
        body.light-mode .bg-white\/5 {
            background-color: #f8fafc !important;
            border-color: #e2e8f0 !important;
        }

        .text-glow {
            text-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
        }

        .button-glow:hover {
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.6);
            transform: translateY(-1px);
        }

        /* Customize Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 17, 26, 0.3);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.5);
        }

        /* Pulsing/Breathing Animations */
        @keyframes breathe {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        .breathing-glow {
            animation: breathe 3s infinite ease-in-out;
        }

        @keyframes pulse-border {
            0%, 100% { border-color: rgba(99, 102, 241, 0.3); }
            50% { border-color: rgba(139, 92, 246, 0.8); }
        }
        .pulsing-border {
            animation: pulse-border 2.5s infinite ease-in-out;
        }
    </style>

    <!-- React and ReactDOM production CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel Standalone compiler CDN for dynamic JSX processing -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- ApexCharts CDN for stunning analytical visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>
<body class="py-6 px-4 md:px-8">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Core UI Components ---

        // Custom Header with breathing connection status indicator, author attribution, nav buttons and theme toggle
        const Header = ({ status, theme, onToggleTheme, onOpenGuide, onOpenAbout }) => {
            let statusColor = "bg-yellow-500 shadow-[0_0_10px_#eab308]";
            let statusText = "Ready";
            
            if (status === "scraping") {
                statusColor = "bg-brandCyan shadow-[0_0_10px_#06b6d4] animate-pulse";
                statusText = "Scraping Live...";
            } else if (status === "completed") {
                statusColor = "bg-brandGreen shadow-[0_0_10px_#10b981]";
                statusText = "Analysis Done";
            } else if (status === "error") {
                statusColor = "bg-brandRed shadow-[0_0_10px_#f43f5e]";
                statusText = "Failed";
            }

            return (
                <header class="w-full flex flex-col md:flex-row items-center justify-between p-4 sm:p-6 mb-6 sm:mb-8 glass-panel rounded-2xl gap-4">
                    <div class="flex flex-col sm:flex-row items-center sm:items-start text-center sm:text-left gap-3 sm:gap-4 w-full md:w-auto">
                        <div class="p-2.5 sm:p-3 bg-brandPrimary/10 rounded-xl border border-brandPrimary/20 flex-shrink-0">
                            <svg class="w-7 h-7 sm:w-8 sm:h-8 text-brandPrimary" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 002 2h2a2 2 0 002-2z" />
                            </svg>
                        </div>
                        <div>
                            <div class="flex flex-wrap items-center justify-center sm:justify-start gap-2">
                                <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight bg-gradient-to-r from-brandPrimary via-brandSecondary to-brandCyan bg-clip-text text-transparent text-glow">
                                    VTU RESULT ANALYSIS TOOL
                                </h1>
                                <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-indigo-500/10 border border-indigo-500/30 text-indigo-400">
                                    By Prof. Uttam Bhise ✨
                                </span>
                            </div>
                            <p class="text-[11px] sm:text-xs text-gray-400 font-medium mt-0.5">Visual Scraping Engine & Academic Performance Dashboard</p>
                        </div>
                    </div>
                    
                    <div class="flex flex-wrap items-center justify-center sm:justify-end gap-2 sm:gap-2.5 w-full md:w-auto">
                        {/* Navigation Bar Action Buttons */}
                        <button 
                            type="button"
                            onClick={onOpenGuide}
                            class="px-3 sm:px-3.5 py-1.5 sm:py-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-bold text-gray-300 hover:text-white transition flex items-center gap-1.5"
                        >
                            <span>📖 How to Use</span>
                        </button>
                        <button 
                            type="button"
                            onClick={onOpenAbout}
                            class="px-3 sm:px-3.5 py-1.5 sm:py-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-bold text-gray-300 hover:text-white transition flex items-center gap-1.5"
                        >
                            <span>ℹ️ About Project</span>
                        </button>
                        
                        {/* Day / Night Mode Toggle Switch */}
                        <button 
                            type="button"
                            onClick={onToggleTheme}
                            title={theme === "dark" ? "Switch to Day Mode" : "Switch to Night Mode"}
                            class={`px-3 sm:px-3.5 py-1.5 sm:py-2 rounded-xl border transition flex items-center gap-1.5 sm:gap-2 text-xs font-bold shadow-sm ${

                                    ? 'bg-white/5 hover:bg-white/10 border-white/10 text-amber-400' 
                                    : 'bg-slate-100 hover:bg-slate-200 border-slate-300 text-indigo-600'
                            }`}
                        >
                            {theme === "dark" ? (
                                <>
                                    <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                                    </svg>
                                    <span>Day Mode ☀️</span>
                                </>
                            ) : (
                                <>
                                    <svg class="w-4 h-4 text-indigo-600" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                                    </svg>
                                    <span>Night Mode 🌙</span>
                                </>
                            )}
                        </button>

                        <div class="flex items-center gap-2 px-3 py-2 bg-white/5 rounded-xl border border-white/5">
                            <span class={`w-2.5 h-2.5 rounded-full ${statusColor}`}></span>
                            <span class="text-xs font-semibold uppercase tracking-wider text-gray-300">{statusText}</span>
                        </div>
                    </div>
                </header>
            );
        };

        // --- How to Use Guide Modal ---
        const GuideModal = ({ isOpen, onClose }) => {

            return (

                            <div class="flex items-center gap-3">
                                <span class="text-2xl">📖</span>
                                <div>
                                    <h3 class="text-xl font-bold text-white">How to Use the Crawler</h3>

                                </h4>
                                <p class="text-xs text-gray-300 leading-relaxed">
                                    Choose <strong>USN Range</strong> mode to specify starting and ending USNs (e.g., <code>1SG23CS001</code> to <code>1SG23CS060</code>), with optional 400-series lateral entry ranges. Alternatively, choose <strong>USN List</strong> mode to paste comma-separated USNs or custom ranges.
                                </p>
                            </div>

                            <div class="p-4 bg-white/5 rounded-2xl border border-white/5 space-y-2">
                                <h4 class="font-bold text-brandPrimary flex items-center gap-2">

                                </p>
                            </div>

                            <div class="p-4 bg-white/5 rounded-2xl border border-white/5 space-y-2">
                                <h4 class="font-bold text-brandGreen flex items-center gap-2">
                                    <span>3️⃣ Step 3: Interactive Captcha Verification & Invalid USN Handling</span>
                                </h4>
                                <p class="text-xs text-gray-300 leading-relaxed">
                                    When scraping live, an interactive <strong>Captcha Modal</strong> appears with the real captcha screenshot. Type the 6 characters and hit enter. If blurry, click <strong>🔄 Refresh Captcha</strong> to reload a fresh image. If a student USN is invalid or unannounced, the scraper automatically skips it!
                                </p>
                            </div>

                            <div class="p-4 bg-white/5 rounded-2xl border border-white/5 space-y-2">
                                <h4 class="font-bold text-brandSecondary flex items-center gap-2">
                                    <span>4️⃣ Step 4: Analytics Dashboard & Excel Report Export</span>
                                </h4>
                                <p class="text-xs text-gray-300 leading-relaxed">
                                    Once complete, inspect pass rates, top 10 toppers, subject metrics, and backlog lists. Click <strong>Download Bundled Report (.XLSX)</strong> to save a multi-sheet formatted Excel workbook.
                                </p>
                            </div>
                        </div>

                        <div class="mt-6 pt-4 border-t border-white/10 flex justify-end">
                            <button onClick={onClose} class="px-6 py-2.5 bg-brandPrimary rounded-xl text-white font-bold text-xs button-glow">Got It, Let's Crawl!</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- About Project Modal ---
        const AboutModal = ({ isOpen, onClose }) => {
            if (!isOpen) return null;
            return (
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
                    <div class="w-full max-w-2xl glass-panel-heavy p-6 md:p-8 rounded-3xl border border-white/10 shadow-2xl max-h-[90vh] overflow-y-auto scrollbar-thin">
                        <div class="flex items-center justify-between pb-4 border-b border-white/10 mb-6">
                            <div class="flex items-center gap-3">
                                <span class="text-2xl">ℹ️</span>
                                <div>
                                    <h3 class="text-xl font-bold text-white">About VTU Result Analysis Platform</h3>
                                    <p class="text-xs text-gray-400">High-Performance Visual Scraping Engine & Academic Analytics Hub</p>
                                </div>
                            </div>
                            <button onClick={onClose} class="text-gray-400 hover:text-white p-2 rounded-xl bg-white/5 border border-white/5 font-bold">✕</button>
                        </div>

                        <div class="space-y-5 text-xs text-gray-300 leading-relaxed">
                            <p>
                                The <strong>VTU Result Analysis Tool</strong> is a full-stack automated intelligence platform built to crawl, parse, analyze, and visualize Visvesvaraya Technological University (VTU) semester examination results for engineering institutions.
                            </p>

                                <div class="p-3 bg-white/5 rounded-xl border border-white/5">
                                    <span class="font-bold text-brandGreen">🤖 Selenium Engine & Captcha Handler</span>

                                </div>
                                <div class="p-3 bg-white/5 rounded-xl border border-white/5">
                                    <span class="font-bold text-brandPrimary">📊 Interactive ApexCharts Analytics</span>
                                    <p class="text-[11px] text-gray-400 mt-1">Visual graphs for subject-wise pass percentages, class score averages, and pass/fail donut ratios.</p>
                                </div>
                                <div class="p-3 bg-white/5 rounded-xl border border-white/5">

                                    <p class="text-[11px] text-gray-400 mt-1">Automated creation of color-coded Excel workbooks with topper lists, subject performance, and remedial directories.</p>

                                <h4 class="text-lg font-extrabold text-white text-glow">Prof. Uttam Bhise</h4>
                                <p class="text-xs text-indigo-200 font-medium">Assistant Professor at Yenepoya Institute of Technology (YIT), Moodbidri</p>
                                <p class="text-xs text-brandCyan font-mono pt-1">📧 <a href="mailto:uttamabhise@gmail.com" class="hover:underline">uttamabhise@gmail.com</a></p>
                            </div>
                        </div>

                        <div class="mt-6 pt-4 border-t border-white/10 flex justify-end">
                            <button onClick={onClose} class="px-6 py-2.5 bg-brandPrimary rounded-xl text-white font-bold text-xs button-glow">Close Overview</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Footer Component ---
        const Footer = ({ onOpenGuide, onOpenAbout }) => {
            return (
                <footer class="w-full mt-16 pt-8 pb-8 border-t border-white/10 glass-panel rounded-2xl px-6 md:px-10">
                    <div class="grid grid-cols-1 md:grid-cols-12 gap-8 mb-8">
                        {/* Brand & Overview */}
                        <div class="md:col-span-5 space-y-3">
                            <div class="flex items-center gap-3">
                                <div class="p-2 bg-brandPrimary/10 rounded-lg border border-brandPrimary/20">
                                    <svg class="w-5 h-5 text-brandPrimary" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">

                            <p class="text-xs text-gray-400 leading-relaxed max-w-sm">
                                High-performance automated web scraping engine and deep academic analytics platform designed for engineering batch result extraction and reporting.
                            </p>
                            <div class="flex items-center gap-2 pt-1">
                                <span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-brandPrimary/10 border border-brandPrimary/20 text-brandPrimary">
                                    v1.2.0 Production
                                </span>
                                <span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-brandGreen/10 border border-brandGreen/20 text-brandGreen">
                                    FastAPI + Selenium + React

                        </div>

                        {/* Quick Navigation */}
                        <div class="md:col-span-3 space-y-2">
                            <h4 class="text-xs font-bold text-white uppercase tracking-wider mb-3">Quick Actions</h4>
                            <ul class="space-y-2 text-xs text-gray-400">

                        {/* Author Info Card */}
                        <div class="md:col-span-4 space-y-3 p-5 rounded-2xl border border-indigo-500/20 bg-gradient-to-br from-indigo-500/10 via-purple-500/5 to-cyan-500/10 backdrop-blur-md shadow-md">
                            <div class="flex items-center justify-between">
                                <h4 class="text-xs font-extrabold uppercase tracking-widest text-indigo-600 dark:text-indigo-400">Project Author</h4>
                                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-indigo-500/10 border border-indigo-500/20 text-indigo-600 dark:text-indigo-300">Faculty & Creator ✨</span>

                                    UB

                                    <h5 class="text-base font-extrabold text-gray-900 dark:text-white leading-tight">Prof. Uttam Bhise</h5>

                            </div>
                            <p class="text-xs text-gray-600 dark:text-gray-300 leading-relaxed font-medium">Designed and built with precision for automated VTU academic result analysis.</p>
                            <div class="pt-2 border-t border-white/10 flex items-center gap-2 text-xs">
                                <span class="text-gray-500 dark:text-gray-400 font-semibold">📧 Contact:</span>
                                <a href="mailto:uttamabhise@gmail.com" class="font-mono font-bold text-indigo-600 dark:text-brandCyan hover:underline">uttamabhise@gmail.com</a>

                    </div>

        };

        // Retro glowing terminal log console
        const TerminalConsole = ({ logs }) => {
            const bottomRef = useRef(null);

            useEffect(() => {
                bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [logs]);

            return (
                <div class="flex flex-col h-full min-h-[300px] max-h-[380px] glass-panel rounded-2xl overflow-hidden border border-white/5">
                    <div class="flex items-center justify-between px-4 py-2.5 bg-black/40 border-b border-white/5">
                        <div class="flex items-center gap-1.5">
                            <span class="w-3 h-3 rounded-full bg-brandRed/60"></span>
                            <span class="w-3 h-3 rounded-full bg-brandOrange/60"></span>
                            <span class="w-3 h-3 rounded-full bg-brandGreen/60"></span>
                        </div>
                        <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest font-mono">Console Logs</span>
                        <span class="text-[10px] font-semibold text-brandPrimary/80 font-mono">v1.0.0</span>
                    </div>
                    <div class="flex-1 p-4 bg-black/30 overflow-y-auto font-mono text-xs text-brandCyan/90 leading-relaxed scrollbar-thin">
                        {logs.map((log, index) => (
                            <div key={index} class="mb-1.5 flex gap-2">
                                <span class="text-brandSecondary font-bold select-none">&gt;</span>
                                <span class="break-all">{log}</span>
                            </div>
                        ))}
                        {logs.length === 0 && (
                            <div class="text-gray-500 italic text-center py-12">Scraping log activity is currently idle. Press Crawl to initiate.</div>
                        )}
                        <div ref={bottomRef} />
                    </div>
                </div>
            );
        };

        // ApexCharts React hooks wrapper for subject comparison
        const SubjectAnalyticsChart = ({ subjectData, appTheme = "dark" }) => {
            const chartContainerRef = useRef(null);

            useEffect(() => {
                if (!chartContainerRef.current || !subjectData || subjectData.length === 0) return;

                const categories = subjectData.map(s => s.code);
                const passPercentages = subjectData.map(s => s.pass_percentage);
                const averageScores = subjectData.map(s => s.average_marks);
                const isDark = appTheme === "dark";

                const options = {
                    series: [
                        {
                            name: 'Pass Percentage (%)',
                            type: 'column',
                            data: passPercentages
                        },
                        {
                            name: 'Average Score (Marks)',
                            type: 'line',
                            data: averageScores
                        }
                    ],
                    chart: {
                        height: 350,
                        type: 'line',
                        background: 'transparent',
                        toolbar: { show: false }
                    },
                    theme: { mode: isDark ? 'dark' : 'light' },
                    stroke: {
                        width: [0, 3],
                        curve: 'smooth'
                    },
                    colors: ['#6366f1', '#06b6d4'],
                    fill: {
                        opacity: [0.85, 1],
                        gradient: {
                            inverseColors: false,
                            shade: isDark ? 'dark' : 'light',
                            type: "vertical",
                            opacityFrom: 0.85,
                            opacityTo: 0.55,
                        }
                    },
                    labels: categories,
                    xaxis: {
                        type: 'category',
                        labels: { style: { colors: isDark ? '#9ca3af' : '#475569', fontFamily: 'Outfit' } }
                    },
                    yaxis: [
                        {
                            title: {
                                text: 'Pass Percentage (%)',
                                style: { color: '#6366f1', fontFamily: 'Outfit' }
                            },
                            labels: {
                                style: { colors: isDark ? '#9ca3af' : '#475569' },
                                formatter: (val) => `${val}%`
                            },
                            min: 0,
                            max: 100
                        },
                        {
                            opposite: true,
                            title: {
                                text: 'Average Score',
                                style: { color: '#06b6d4', fontFamily: 'Outfit' }
                            },
                            labels: { style: { colors: isDark ? '#9ca3af' : '#475569' } },
                            min: 0,
                            max: 100
                        }
                    ],
                    grid: { borderColor: isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)' },
                    tooltip: {
                        theme: isDark ? 'dark' : 'light',
                        shared: true,
                        intersect: false,
                        y: {
                            formatter: function (y) {
                                if (typeof y !== "undefined") {
                                    return y.toFixed(1);
                                }
                                return y;
                            }
                        }
                    },
                    legend: {
                        fontFamily: 'Outfit',
                        labels: { colors: isDark ? '#e5e7eb' : '#334155' }
                    }
                };

                const chart = new ApexCharts(chartContainerRef.current, options);
                chart.render();

                return () => chart.destroy();
            }, [subjectData, appTheme]);

            return <div ref={chartContainerRef} />;
        };

        // Donut Chart for Pass / Fail ratio
        const PassFailDonutChart = ({ summary, appTheme = "dark" }) => {
            const containerRef = useRef(null);

            useEffect(() => {
                if (!containerRef.current || !summary) return;

                const isDark = appTheme === "dark";

                const options = {
                    series: [summary.passed_count, summary.failed_count],
                    chart: {
                        type: 'donut',
                        height: 250,
                        background: 'transparent'
                    },
                    labels: ['Passed', 'Failed'],
                    colors: ['#10b981', '#f43f5e'],
                    theme: { mode: isDark ? 'dark' : 'light' },
                    stroke: { show: false },
                    plotOptions: {
                        pie: {
                            donut: {
                                size: '70%',
                                labels: {
                                    show: true,
                                    name: { fontFamily: 'Outfit', color: isDark ? '#e5e7eb' : '#334155' },
                                    value: {
                                        fontFamily: 'Outfit',
                                        color: isDark ? '#ffffff' : '#0f172a',
                                        fontSize: '22px',
                                        fontWeight: '800',
                                        formatter: (val) => val
                                    },
                                    total: {
                                        show: true,
                                        label: 'Total',
                                        fontFamily: 'Outfit',
                                        color: isDark ? '#9ca3af' : '#64748b',
                                        formatter: () => summary.total_students
                                    }
                                }
                            }
                        }
                    },
                    dataLabels: { show: false },
                    legend: {
                        position: 'bottom',
                        fontFamily: 'Outfit',
                        labels: { colors: isDark ? '#e5e7eb' : '#334155' }
                    },
                    tooltip: { theme: isDark ? 'dark' : 'light' }
                };

                const chart = new ApexCharts(containerRef.current, options);
                chart.render();

                return () => chart.destroy();
            }, [summary, appTheme]);

            return <div ref={containerRef} />;
        };

        // --- Main App Component ---
        const App = () => {
            // Theme state (Dark/Night mode vs Light/Day mode)
            const [theme, setTheme] = useState(() => {
                return localStorage.getItem("vtu_theme") || "dark";
            });

            useEffect(() => {
                document.body.className = theme === "dark" ? "dark-mode" : "light-mode";
                localStorage.setItem("vtu_theme", theme);
            }, [theme]);

            const toggleTheme = () => {
                setTheme(prev => (prev === "dark" ? "light" : "dark"));
            };

            // State configs
            const [portalUrl, setPortalUrl] = useState("https://results.vtu.ac.in/");
            const [inputMode, setInputMode] = useState("range"); // range vs list
            const [startUsn, setStartUsn] = useState("");
            const [endUsn, setEndUsn] = useState("");
            const [usnList, setUsnList] = useState("");
            const [latStartUsn, setLatStartUsn] = useState("");
            const [latEndUsn, setLatEndUsn] = useState("");
            const [enableLatRange, setEnableLatRange] = useState(false);
            const [scrapingStatus, setScrapingStatus] = useState("idle"); // idle, scraping, completed, error
            const [logs, setLogs] = useState([]);
            const [progress, setProgress] = useState({ current: 0, total: 0, usn: "" });
            const [scrapedResults, setScrapedResults] = useState([]);
            const [captchaRequired, setCaptchaRequired] = useState(null); // { usn, captchaImg, attempt }
            const [captchaCode, setCaptchaCode] = useState("");
            const [isRefreshingCaptcha, setIsRefreshingCaptcha] = useState(false);
            const [sessionID, setSessionID] = useState("");
            const [analysisResults, setAnalysisResults] = useState(null);
            const [processedUsns, setProcessedUsns] = useState(new Set());
            
            // UI modal & navigation state
            const [showGuideModal, setShowGuideModal] = useState(false);
            const [showAboutModal, setShowAboutModal] = useState(false);
            const [activeTab, setActiveTab] = useState("directory"); // directory, subjects, toppers, backlogs
            const [searchTerm, setSearchTerm] = useState("");
            const [statusFilter, setStatusFilter] = useState("ALL");

            const wsRef = useRef(null);
            const captchaInputRef = useRef(null);

            // Auto-focus captcha entry field when it loads
            useEffect(() => {
                if (captchaRequired && captchaInputRef.current) {
                    captchaInputRef.current.focus();
                }
            }, [captchaRequired]);

            // Add starting log
            useEffect(() => {
                setLogs(["Result Scraping Portal is loaded and ready. Configure params and execute."]);
            }, []);

            // Connect & Start/Resume Scraper connection
            const handleConnectAndScrape = (isResume = false) => {
                // Input validation
                if (inputMode === "range" && (!startUsn || !endUsn)) {
                    alert("Please input starting and ending USN numbers.");
                    return;
                }
                if (inputMode === "list" && !usnList) {
                    alert("Please input one or more comma-separated USNs.");
                    return;
                }

                if (!isResume) {
                    setScrapedResults([]);
                    setProcessedUsns(new Set());
                    setAnalysisResults(null);
                    setProgress({ current: 0, total: 0, usn: "" });
                }

                setCaptchaRequired(null);
                setScrapingStatus("scraping");
                
                const uuidSession = sessionID && isResume ? sessionID : ("sess-" + Math.random().toString(36).substring(2, 15));
                setSessionID(uuidSession);

                if (isResume) {
                    setLogs(prev => [
                        ...prev, 
                        `[RESUME] Re-establishing connection for session: ${uuidSession}`,
                        `[RESUME] Preserving ${scrapedResults.length} previously scraped student records...`,
                        `Connecting to scraper server...`
                    ]);
                } else {
                    setLogs(prev => [
                        ...prev, 
                        `[INIT] Generating new crawling session: ${uuidSession}`, 
                        `Connecting to scraper server...`
                    ]);
                }

                // Open WebSocket
                const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
                const wsUrl = `${protocol}//${window.location.host}/ws/scrape/${uuidSession}`;
                
                const ws = new WebSocket(wsUrl);
                wsRef.current = ws;

                ws.onopen = () => {
                    setLogs(prev => [...prev, `[SERVER] Connection established successfully.`]);
                    
                    let finalStart = startUsn;
                    let finalEnd = endUsn;
                    let finalUsnList = usnList;

                    if (inputMode === "range" && enableLatRange && latStartUsn && latEndUsn) {
                        finalUsnList = `${startUsn}-${endUsn}, ${latStartUsn}-${latEndUsn}`;
                        finalStart = "";
                        finalEnd = "";
                    }

                    // Send configs with resume parameters
                    const configPayload = {
                        start_usn: inputMode === "range" && !finalUsnList ? finalStart : "",
                        end_usn: inputMode === "range" && !finalUsnList ? finalEnd : "",
                        usn_list: inputMode === "list" ? finalUsnList : (finalUsnList || ""),
                        portal_url: portalUrl,
                        existing_results: isResume ? scrapedResults : [],
                        completed_usns: isResume ? Array.from(processedUsns) : [],
                        start_from_usn: isResume ? (progress.usn || "") : ""
                    };
                    ws.send(JSON.stringify(configPayload));
                };

                ws.onmessage = (event) => {
                    const msg = JSON.parse(event.data);
                    
                    if (msg.type === "log") {
                        setLogs(prev => [...prev, msg.message]);
                    } 
                    else if (msg.type === "status_update") {
                        setProgress({
                            current: msg.current,
                            total: msg.total,
                            usn: msg.usn
                        });
                        setLogs(prev => [...prev, `[SCRAPING] Loading results for ${msg.usn} (${msg.current}/${msg.total})`]);
                    }
                    else if (msg.type === "captcha_required") {
                        setLogs(prev => [...prev, `[CAPTCHA] Solver request for USN: ${msg.usn} (Attempt #${msg.attempt})`]);
                        setCaptchaRequired({
                            usn: msg.usn,
                            captchaImg: msg.captcha_img,
                            attempt: msg.attempt,
                            message: msg.message || ""
                        });
                        setCaptchaCode("");
                        setIsRefreshingCaptcha(false);
                    }
                    else if (msg.type === "progress") {
                        // Reset captcha modal if open
                        setCaptchaRequired(null);
                        
                        if (msg.usn) {
                            setProcessedUsns(prev => new Set(prev).add(msg.usn));
                        }

                        if (msg.status === "SUCCESS") {
                            setScrapedResults(prev => {
                                const exists = prev.some(s => s.usn === msg.data.usn);
                                return exists ? prev : [...prev, msg.data];
                            });
                        }
                        setLogs(prev => [...prev, msg.message]);
                    }
                    else if (msg.type === "completed") {
                        setScrapingStatus("completed");
                        setCaptchaRequired(null);
                        
                        if (msg.error) {
                            setLogs(prev => [...prev, `❌ ERROR: ${msg.error}`]);
                            setScrapingStatus("error");
                        } else {
                            setLogs(prev => [...prev, msg.message]);
                            setAnalysisResults(msg.analysis);
                        }
                        ws.close();
                    }
                    else if (msg.type === "error") {
                        setLogs(prev => [
                            ...prev, 
                            `❌ FATAL ERROR: ${msg.message}`,
                            `💡 Tip: Connection or server issue occurred. You can click 'Continue Crawling' to resume from USN: ${progress.usn || 'failed position'}.`
                        ]);
                        setScrapingStatus("error");
                        setCaptchaRequired(null);
                        ws.close();
                    }
                };

                ws.onerror = (err) => {
                    setLogs(prev => [
                        ...prev, 
                        `[ERROR] Connection failed. Scraper server may be offline.`,
                        `💡 Tip: You can click 'Continue Crawling' to resume from where connection failed.`
                    ]);
                    setScrapingStatus("error");
                };

                ws.onclose = () => {
                    console.log("WebSocket connection closed.");
                };
            };

            // Refresh Captcha image from server
            const handleRefreshCaptcha = () => {
                if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
                    setIsRefreshingCaptcha(true);
                    setLogs(prev => [...prev, `[CAPTCHA] Requesting fresh CAPTCHA image for USN: ${captchaRequired?.usn}...`]);
                    wsRef.current.send(JSON.stringify({ action: "refresh_captcha" }));
                }
            };

            // Submit Captcha response
            const handleCaptchaSubmit = (e) => {
                if (e) e.preventDefault();
                if (!captchaCode) return;
                
                if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
                    setLogs(prev => [...prev, `Submitting captcha code: "${captchaCode}"...`]);
                    wsRef.current.send(JSON.stringify({ captcha_code: captchaCode }));
                    setCaptchaRequired(null); // Close modal
                }
            };

            // Stop Scraper connection
            const handleStopScrape = () => {
                if (wsRef.current) {
                    wsRef.current.close();
                    setLogs(prev => [...prev, `⚠️ Scraper session cancelled by user.`]);
                    setScrapingStatus("idle");
                    setCaptchaRequired(null);
                }
            };

            // Filter data rows in Student Directory Tab
            const filteredResults = scrapedResults.filter(student => {
                const matchesSearch = student.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                     student.usn.toLowerCase().includes(searchTerm.toLowerCase());
                
                if (statusFilter === "ALL") return matchesSearch;
                if (statusFilter === "PASS") return matchesSearch && "FAIL" !== student.status;
                if (statusFilter === "FAIL") return matchesSearch && "FAIL" === student.status;
                
                // Specific class filters
                return matchesSearch && student.status.includes(statusFilter);
            });

            return (
                <div class="max-w-7xl mx-auto pb-16">
                    <Header 
                        status={scrapingStatus} 
                        theme={theme} 
                        onToggleTheme={toggleTheme} 
                        onOpenGuide={() => setShowGuideModal(true)}
                        onOpenAbout={() => setShowAboutModal(true)}
                    />
                    
                    {/* How to Use Guide Modal */}
                    <GuideModal isOpen={showGuideModal} onClose={() => setShowGuideModal(false)} />

                    {/* About Project Modal */}
                    <AboutModal isOpen={showAboutModal} onClose={() => setShowAboutModal(false)} />
                    
                    {/* Captcha Modal Overlay */}
                    {captchaRequired && (
                        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-md">
                            <div class="w-full max-w-md glass-panel-heavy p-6 rounded-3xl pulsing-border border text-center shadow-2xl">
                                <span class="inline-block px-3 py-1 bg-brandPrimary/10 border border-brandPrimary/20 rounded-full text-brandPrimary text-xs font-bold uppercase tracking-wider mb-2">
                                    Captcha Verification
                                </span>
                                <h3 class="text-xl font-bold text-white mb-1">Verify Seat Number</h3>
                                <p class="text-xs text-gray-400 mb-4">Solving captcha for student USN: <span class="text-brandCyan font-mono font-bold">{captchaRequired.usn}</span></p>

                                {captchaRequired.message && captchaRequired.attempt > 1 && (
                                    <div class="mb-4 p-3 bg-red-500/20 border border-red-500/40 rounded-xl flex items-center justify-center gap-2 text-xs text-red-300 font-bold animate-pulse">
                                        <svg class="w-4 h-4 text-red-400 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                                        </svg>
                                        <span>{captchaRequired.message}</span>
                                    </div>
                                )}
                                
                                <div class="flex flex-col items-center gap-3 p-4 bg-white/5 rounded-2xl border border-white/5 mb-6">
                                    <div class="relative flex items-center justify-center gap-3 bg-white p-2.5 rounded-xl border border-white/10 shadow-inner w-full">
                                        <img src={captchaRequired.captchaImg} alt="CAPTCHA Code" class="h-12 w-auto object-contain rounded" />
                                        <button 
                                            type="button" 
                                            onClick={handleRefreshCaptcha}
                                            disabled={isRefreshingCaptcha}
                                            title="Refresh CAPTCHA image"
                                            class="p-2 rounded-lg bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-700 transition flex items-center justify-center border border-gray-300 shadow-sm disabled:opacity-50"
                                        >
                                            <svg class={`w-5 h-5 text-gray-700 ${isRefreshingCaptcha ? 'animate-spin text-brandPrimary' : ''}`} fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                            </svg>
                                        </button>
                                    </div>
                                    <div class="flex items-center justify-between w-full text-[10px] px-1">
                                        <span class="text-brandSecondary font-medium">Attempt #{captchaRequired.attempt} of 4</span>
                                        <button 
                                            type="button" 
                                            onClick={handleRefreshCaptcha} 
                                            disabled={isRefreshingCaptcha}
                                            class="text-brandCyan hover:text-white font-semibold flex items-center gap-1 transition disabled:opacity-50"
                                        >
                                            <span>{isRefreshingCaptcha ? "Refreshing..." : "🔄 Refresh Captcha"}</span>
                                        </button>
                                    </div>
                                </div>
                                
                                <form onSubmit={handleCaptchaSubmit} class="flex flex-col gap-4">
                                    <input 
                                        ref={captchaInputRef}
                                        type="text" 
                                        value={captchaCode}
                                        onChange={(e) => setCaptchaCode(e.target.value)}
                                        placeholder="Type characters here..."
                                        maxlength="6"
                                        class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-center text-lg font-bold font-mono tracking-widest text-white focus:outline-none focus:border-brandSecondary"
                                        required
                                    />
                                    <div class="flex gap-3">
                                        <button 
                                            type="button"
                                            onClick={handleStopScrape}
                                            class="flex-1 px-4 py-2.5 bg-white/5 hover:bg-white/10 border border-white/5 rounded-xl text-gray-300 text-sm font-semibold transition"
                                        >
                                            Abort Job
                                        </button>
                                        <button 
                                            type="submit"
                                            class="flex-1 px-4 py-2.5 bg-gradient-to-r from-brandPrimary to-brandSecondary hover:opacity-90 rounded-xl text-white text-sm font-semibold transition button-glow shadow-lg shadow-brandPrimary/20"
                                        >
                                            Submit Code
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Main Scrape Settings & Terminal Grid */}
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-8">
                        {/* Config Panel */}
                        <div class="lg:col-span-5 glass-panel p-6 rounded-2xl flex flex-col justify-between">
                            <div>
                                <h3 class="text-lg font-bold text-white mb-5 flex items-center gap-2">
                                    <svg class="w-5 h-5 text-brandPrimary" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    </svg>
                                    CRAWLER CONFIGURATIONS
                                </h3>
                                
                                {/* URL Portal */}
                                <div class="mb-4">
                                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">VTU Results Target URL</label>
                                    <input 
                                        type="url" 
                                        value={portalUrl}
                                        onChange={(e) => setPortalUrl(e.target.value)}
                                        disabled={scrapingStatus === "scraping"}
                                        class="w-full bg-black/30 border border-white/5 focus:border-brandPrimary focus:outline-none rounded-xl px-4 py-2.5 text-sm text-gray-300 font-mono"
                                    />
                                </div>
                                
                                {/* Scraper Options */}
                                <div class="mb-4">
                                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">Input Mode Selection</label>
                                    <div class="flex rounded-xl bg-black/40 border border-white/5 p-0.5">
                                        <button 
                                            type="button" 
                                            onClick={() => setInputMode("range")}
                                            disabled={scrapingStatus === "scraping"}
                                            class={`flex-1 py-2.5 text-center text-xs font-bold rounded-lg transition ${inputMode === "range" ? 'bg-brandPrimary text-white shadow' : 'text-gray-400 hover:text-white'}`}
                                        >
                                            USN Range Mode
                                        </button>
                                        <button 
                                            type="button" 
                                            onClick={() => setInputMode("list")}

                                                        <tr key={idx} class="border-b border-white/5 hover:bg-white/5 transition-all whitespace-nowrap">
                                                            <td class="py-3.5 px-4 text-center">
                                                                <span class={`inline-flex w-7 h-7 rounded-full items-center justify-center text-xs ${rankBadge}`}>
                                                                    {isRank1 ? "👑" : topper.rank}
                                                                </span>
                                                            </td>
                                                            <td class="py-3.5 px-4 font-mono font-bold text-gray-300">{topper.usn}</td>
                                                            <td class="py-3.5 px-4 font-extrabold text-white uppercase flex items-center gap-2">
                                                                {topper.name}
                                                            </td>
                                                            <td class="py-3.5 px-4 text-right font-bold text-gray-300">{topper.total_marks} / {topper.max_marks}</td>
                                                            <td class="py-3.5 px-4 text-right font-bold text-brandCyan font-mono">{topper.percentage}%</td>
                                                            <td class="py-3.5 px-4 text-center">
                                                                <span class="inline-block px-3 py-1 rounded-full border border-brandPrimary/20 bg-brandPrimary/10 text-brandPrimary text-[10px] font-bold tracking-wider">
                                                                    {topper.status}
                                                                </span>
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    )}

                                    {/* Remedial List Content */}
                                    {activeTab === "backlogs" && (
                                        <table class="w-full text-left text-xs border-collapse">
                                            <thead>
                                                <tr class="border-b border-white/5 text-gray-400 uppercase tracking-widest font-bold whitespace-nowrap">
                                                    <th class="py-3 px-4">USN</th>
                                                    <th class="py-3 px-4">Student Name</th>
                                                    <th class="py-3 px-4 text-right">Aggregated Score</th>
                                                    <th class="py-3 px-4 text-right">Backlog Count</th>
                                                    <th class="py-3 px-4 text-center">Failed Subject Codes</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {analysisResults.failed_students.map((student, idx) => (
                                                    <tr key={idx} class="border-b border-white/5 hover:bg-white/5 transition-all whitespace-nowrap">
                                                        <td class="py-3.5 px-4 font-mono font-bold text-gray-300">{student.usn}</td>
                                                        <td class="py-3.5 px-4 font-bold text-white uppercase">{student.name}</td>
                                                        <td class="py-3.5 px-4 text-right font-semibold text-gray-400">{student.total_marks}</td>
                                                        <td class="py-3.5 px-4 text-right text-brandRed font-extrabold text-sm">{student.failed_subjects.length}</td>
                                                        <td class="py-3.5 px-4 text-center font-mono">
                                                            {student.failed_subjects.map((code, sIdx) => (
                                                                <span key={sIdx} class="inline-block px-2 py-0.5 bg-brandRed/10 border border-brandRed/20 rounded text-[10px] text-brandRed font-bold mr-1.5">
                                                                    {code}
                                                                </span>
                                                            ))}
                                                        </td>
                                                    </tr>
                                                ))}
                                                {analysisResults.failed_students.length === 0 && (
                                                    <tr>
                                                        <td colspan="5" class="py-8 text-center text-brandGreen font-bold italic">
                                                            🎉 Academic Excellence! 100% of students passed all registered courses successfully.
                                                        </td>
                                                    </tr>
                                                )}
                                            </tbody>
                                        </table>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer Component */}
                    <Footer 
                        onOpenGuide={() => setShowGuideModal(true)} 
                        onOpenAbout={() => setShowAboutModal(true)} 
                    />
                </div>
            );
        };

        // Render the application into root container
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
