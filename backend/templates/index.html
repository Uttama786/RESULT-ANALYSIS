<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTU Result Analysis & Crawling Hub</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS with custom styling properties -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090a0f',
                        glassBg: 'rgba(15, 17, 26, 0.7)',
                        glassBorder: 'rgba(255, 255, 255, 0.08)',
                        brandPrimary: '#6366f1', // Indigo
                        brandSecondary: '#8b5cf6', // Violet
                        brandCyan: '#06b6d4', // Cyan
                        brandGreen: '#10b981', // Emerald
                        brandRed: '#f43f5e', // Rose
                        brandOrange: '#f97316', // Orange
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS styles for premium glassmorphism and animations -->
    <style>
        body.dark-mode {
            background-color: #090a0f;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: #f3f4f6;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
        }

        body.light-mode {
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
            color: #1e293b;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
        }

        /* Glass Panels - Dark Mode */
        body.dark-mode .glass-panel {
            background: rgba(15, 18, 30, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        body.dark-mode .glass-panel-heavy {
            background: rgba(10, 12, 20, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 16px 48px 0 rgba(0, 0, 0, 0.6);
        }

        /* Glass Panels - Light Mode */
        body.light-mode .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.03);
        }

        body.light-mode .glass-panel-heavy {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(203, 213, 225, 0.9);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }

        /* Light Mode Text & Input Adjustments */
        body.light-mode h3, body.light-mode h2, body.light-mode h1 {
            color: #0f172a;
        }
        body.light-mode .text-gray-300 {
            color: #334155 !important;
        }
        body.light-mode .text-gray-400 {
            color: #64748b !important;
        }
        body.light-mode .text-white {
            color: #0f172a !important;
        }
        body.light-mode input[type="text"], 
        body.light-mode input[type="url"],
        body.light-mode select {
            background-color: #f1f5f9 !important;
            border-color: #cbd5e1 !important;
            color: #0f172a !important;
        }
        body.light-mode .bg-black\/40,
        body.light-mode .bg-black\/30,
        body.light-mode .bg-black\/20 {
            background-color: #f1f5f9 !important;
        }
        body.light-mode .bg-white\/5 {
            background-color: #f8fafc !important;
            border-color: #e2e8f0 !important;
        }

        /* Author Card Styling - Explicit Contrast for Light & Dark Modes */
        body.light-mode .author-card {
            background: #ffffff !important;
            border: 1px solid #cbd5e1 !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.06) !important;
            color: #1e293b !important;
        }
        body.light-mode .author-card h4 {
            color: #4338ca !important;
        }

        /* Profile Dropdown Menu High Contrast Override */
        .profile-dropdown {
            background-color: #0f172a !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            color: #ffffff !important;
        }
        body.light-mode .profile-dropdown p,
        body.light-mode .profile-dropdown span,
        body.light-mode .profile-dropdown div,
        body.light-mode .profile-dropdown button {
            color: #ffffff !important;
        }
        body.light-mode .profile-dropdown .text-brandCyan {
            color: #38bdf8 !important;
        }
        body.light-mode .profile-dropdown .text-brandRed {
            color: #f87171 !important;
        }
        body.light-mode .profile-dropdown .text-brandPrimary {
            color: #a5b4fc !important;
        }
        body.light-mode .profile-dropdown .text-gray-200 {
            color: #f1f5f9 !important;
        }
        body.light-mode .profile-dropdown .text-gray-400 {
            color: #cbd5e1 !important;
        }
        body.light-mode .profile-dropdown button:hover {
            background-color: rgba(255, 255, 255, 0.15) !important;
        }
        body.light-mode .author-card h5 {
            color: #0f172a !important;
        }
        body.light-mode .author-card p {
            color: #475569 !important;
        }
        body.light-mode .author-card .author-role {
            color: #0284c7 !important;
        }
        body.light-mode .author-card .author-badge {
            background-color: #f0f9ff !important;
            border-color: #bae6fd !important;
            color: #0369a1 !important;
        }
        body.light-mode .author-card .author-email {
            color: #0284c7 !important;
        }

        body.dark-mode .author-card {
            background: rgba(15, 23, 42, 0.75) !important;
            backdrop-filter: blur(12px) !important;
            border: 1px solid rgba(99, 102, 241, 0.25) !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4) !important;
            color: #f3f4f6 !important;
        }
        body.dark-mode .author-card h4 {
            color: #818cf8 !important;
        }
        body.dark-mode .author-card h5 {
            color: #ffffff !important;
        }
        body.dark-mode .author-card p {
            color: #cbd5e1 !important;
        }
        body.dark-mode .author-card .author-role {
            color: #38bdf8 !important;
        }
        body.dark-mode .author-card .author-badge {
            background-color: rgba(99, 102, 241, 0.15) !important;
            border-color: rgba(99, 102, 241, 0.3) !important;
            color: #c7d2fe !important;
        }
        body.dark-mode .author-card .author-email {
            color: #38bdf8 !important;
        }

        .text-glow {
            text-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
        }

        .button-glow:hover {
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.6);
            transform: translateY(-1px);
        }

        /* Customize Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 17, 26, 0.3);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.5);
        }

        /* Pulsing/Breathing Animations */
        @keyframes breathe {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        .breathing-glow {
            animation: breathe 3s infinite ease-in-out;
        }

        @keyframes pulse-border {
            0%, 100% { border-color: rgba(99, 102, 241, 0.3); }
            50% { border-color: rgba(139, 92, 246, 0.8); }
        }
        .pulsing-border {
            animation: pulse-border 2.5s infinite ease-in-out;
        }
    </style>

    <!-- React and ReactDOM production CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel Standalone compiler CDN for dynamic JSX processing -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- ApexCharts CDN for stunning analytical visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>
<body class="py-6 px-4 md:px-8">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Core UI Components ---

        // Custom Header with breathing connection status indicator, nav buttons, feedback system, auth badge, history and theme toggle
        const Header = ({ status, theme, onToggleTheme, onOpenGuide, onOpenAbout, onOpenFeedback, user, onOpenAuthModal, onLogout, onOpenUserMgmt, onOpenHistory, onOpenProfile }) => {
            const [profileMenuOpen, setProfileMenuOpen] = useState(false);
            const profileMenuRef = useRef(null);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (profileMenuRef.current && !profileMenuRef.current.contains(event.target)) {
                        setProfileMenuOpen(false);
                    }
                };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            const [istClock, setIstClock] = useState("");

            useEffect(() => {
                const updateIstClock = () => {
                    const now = new Date();
                    const timeStr = now.toLocaleTimeString("en-IN", {
                        timeZone: "Asia/Kolkata",
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit",
                        hour12: true
                    });
                    const dateStr = now.toLocaleDateString("en-IN", {
                        timeZone: "Asia/Kolkata",
                        day: "2-digit",
                        month: "short",
                        year: "numeric"
                    });
                    setIstClock(`${dateStr}, ${timeStr} IST`);
                };
                updateIstClock();
                const interval = setInterval(updateIstClock, 1000);
                return () => clearInterval(interval);
            }, []);

            let statusColor = "bg-yellow-500 shadow-[0_0_10px_#eab308]";
            let statusText = "Ready";
            
            if (status === "scraping") {
                statusColor = "bg-brandCyan shadow-[0_0_10px_#06b6d4] animate-pulse";
                statusText = "Scraping Live...";
            } else if (status === "completed") {
                statusColor = "bg-brandGreen shadow-[0_0_10px_#10b981]";
                statusText = "Analysis Done";
            } else if (status === "error") {
                statusColor = "bg-brandRed shadow-[0_0_10px_#f43f5e]";
                statusText = "Failed";
            }

            return (
                <header class="w-full flex flex-col md:flex-row items-center justify-between p-4 sm:p-5 mb-6 sm:mb-8 glass-panel rounded-2xl gap-4 border border-white/10 shadow-xl relative z-40">
                    {/* Left: Brand Logo & Title */}
                    <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-start">
                        <div class="flex items-center gap-3">
                            <div class="p-2 sm:p-2.5 bg-brandPrimary/10 rounded-xl border border-brandPrimary/20 flex-shrink-0">
                                <svg class="w-6 h-6 sm:w-7 sm:h-7 text-brandPrimary" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 002 2h2a2 2 0 002-2z" />
                                </svg>
                            </div>
                            <div>
                                <h1 class="text-base sm:text-xl font-extrabold tracking-tight bg-gradient-to-r from-brandPrimary via-brandSecondary to-brandCyan bg-clip-text text-transparent text-glow leading-snug">
                                    VTU RESULT ANALYSIS TOOL
                                </h1>
                                <p class="text-[10px] sm:text-xs text-gray-400 font-medium hidden xs:block">Visual Scraping Engine & Academic Dashboard</p>
                            </div>
                        </div>
                    </div>

                    {/* Right: Navbar options row */}
                    <div class="flex flex-wrap items-center justify-center md:justify-end gap-2 sm:gap-2.5 w-full md:w-auto">
                        {/* Live Indian Standard Time (IST) Clock Badge */}
                        <div title="Indian Standard Time (IST - UTC+05:30)" class="flex items-center gap-1.5 px-3 py-1.5 bg-brandPrimary/10 border border-brandPrimary/25 rounded-xl text-xs font-mono font-bold text-brandPrimary shadow-sm">
                            <span>🇮🇳</span>
                            <span>{istClock || "IST"}</span>
                        </div>

                        <div class="flex items-center gap-2 px-3 py-1.5 bg-white/5 rounded-xl border border-white/5">
                            <span class={`w-2.5 h-2.5 rounded-full ${statusColor}`}></span>
                            <span class="text-xs font-semibold uppercase tracking-wider text-gray-300">{statusText}</span>
                        </div>

                        {/* Navigation Bar Action Buttons */}
                        <button 
                            type="button"
                            onClick={onOpenGuide}
                            class="px-3 py-1.5 sm:py-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-bold text-gray-300 hover:text-white transition flex items-center gap-1.5"
                        >
                            <span>📖 How to Use</span>
                        </button>

                        <button 
                            type="button"
                            onClick={onOpenAbout}
                            class="px-3 py-1.5 sm:py-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-bold text-gray-300 hover:text-white transition flex items-center gap-1.5"
                        >
                            <span>ℹ️ About</span>
                        </button>

                        <button 
                            type="button"
                            onClick={onOpenFeedback}
                            class="px-3 py-1.5 sm:py-2 rounded-xl bg-brandCyan/10 hover:bg-brandCyan/20 border border-brandCyan/30 text-xs font-bold text-brandCyan hover:text-white transition flex items-center gap-1.5"
                        >
                            <span>💬 Feedback</span>
                        </button>

                        {/* Theme Toggle Button */}
                        <button 
                            type="button"
                            onClick={onToggleTheme}
                            title={theme === "dark" ? "Switch to Day Mode" : "Switch to Night Mode"}
                            class={`px-3 py-1.5 sm:py-2 rounded-xl border transition flex items-center gap-1.5 text-xs font-bold ${
                                theme === "dark" 
                                    ? 'bg-white/5 hover:bg-white/10 border-white/10 text-amber-400' 
                                    : 'bg-slate-100 hover:bg-slate-200 border-slate-300 text-indigo-600'
                            }`}
                        >
                            {theme === "dark" ? "Day Mode ☀️" : "Night Mode 🌙"}
                        </button>

                        {/* User Profile Menu Dropdown (Top-Right Corner) */}
                        {user ? (
                            <div ref={profileMenuRef} class="relative ml-1 z-50">
                                <button 
                                    type="button"
                                    onClick={() => setProfileMenuOpen(!profileMenuOpen)}
                                    class="flex items-center gap-2 px-2.5 py-1.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl shadow-sm transition focus:outline-none"
                                >
                                    <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-brandPrimary to-brandCyan flex items-center justify-center text-xs font-black text-white shadow-inner">
                                        {user.full_name ? user.full_name.charAt(0).toUpperCase() : user.username.charAt(0).toUpperCase()}
                                    </div>
                                    <div class="hidden sm:flex flex-col text-left">
                                        <span class="text-xs font-extrabold text-white leading-none">{user.full_name || user.username}</span>
                                        <span class="text-[9px] font-bold text-brandCyan leading-tight mt-0.5">
                                            {user.role === "admin" ? "👑 Admin" : "🎓 Student"}
                                        </span>
                                    </div>
                                    <svg class={`w-3.5 h-3.5 text-gray-400 transition-transform ${profileMenuOpen ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                                    </svg>
                                </button>

                                 {/* User Profile Dropdown Submenu */}
                                {profileMenuOpen && (
                                    <div class="absolute right-0 top-full mt-2 w-60 bg-slate-900/95 backdrop-blur-2xl rounded-2xl border border-white/20 shadow-2xl p-2.5 z-50 animate-fade-in profile-dropdown">
                                        <div class="px-3 py-2 border-b border-white/10 mb-1.5">
                                            <p class="text-xs font-bold text-white truncate">{user.full_name || user.username}</p>
                                            <p class="text-[10px] text-brandCyan font-mono">@{user.username}</p>
                                        </div>
                                        <button 
                                            type="button"
                                            onClick={() => { setProfileMenuOpen(false); onOpenProfile(); }}
                                            class="w-full text-left px-3 py-2 rounded-xl text-xs font-bold text-gray-200 hover:bg-white/10 hover:text-white transition flex items-center gap-2 mb-1"
                                        >
                                            <span>👤 Profile</span>
                                        </button>
                                        <button 
                                            type="button"
                                            onClick={() => { setProfileMenuOpen(false); onOpenHistory(); }}
                                            class="w-full text-left px-3 py-2 rounded-xl text-xs font-bold text-gray-200 hover:bg-white/10 hover:text-white transition flex items-center gap-2"
                                        >
                                            <span>📂 Result Analysis History</span>
                                        </button>
                                        {user && user.role === "admin" && user.username && user.username.toLowerCase() === "uttambhise" && (
                                            <button 
                                                type="button"
                                                onClick={() => { setProfileMenuOpen(false); onOpenUserMgmt(); }}
                                                class="w-full text-left px-3 py-2 rounded-xl text-xs font-bold text-brandPrimary hover:bg-brandPrimary/10 transition flex items-center gap-2 mt-1"
                                            >
                                                <span>👥 Manage Users</span>
                                            </button>
                                        )}
                                        <div class="border-t border-white/10 mt-1.5 pt-1.5">
                                            <button 
                                                type="button"
                                                onClick={() => { setProfileMenuOpen(false); onLogout(); }}
                                                class="w-full text-left px-3 py-2 rounded-xl text-xs font-bold text-brandRed hover:bg-brandRed/10 transition flex items-center gap-2"
                                            >
                                                <span>🚪 Sign Out</span>
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        ) : (
                            <button 
                                type="button"
                                onClick={onOpenAuthModal}
                                class="px-3.5 py-1.5 sm:py-2 rounded-xl bg-gradient-to-r from-brandPrimary to-brandSecondary text-xs font-extrabold text-white transition button-glow shadow-md shadow-brandPrimary/20 flex items-center gap-1.5 ml-1"
                            >
                                <span>🔐 Login</span>
                            </button>
                        )}
                    </div>
                </header>
            );
        };

        // --- User Profile Details Modal ---
        const ProfileModal = ({ isOpen, onClose, user, onLogout }) => {
            if (!isOpen || !user) return null;
            return (
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fade-in">
                    <div class="w-full max-w-md glass-panel-heavy p-6 md:p-8 rounded-3xl border border-white/10 shadow-2xl relative">
                        <button onClick={onClose} class="absolute top-4 right-4 text-gray-400 hover:text-white p-2 rounded-xl bg-white/5 border border-white/5 font-bold transition">✕</button>
                        
                        <div class="text-center mb-6">
                            <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-brandPrimary via-brandSecondary to-brandCyan flex items-center justify-center text-2xl font-black text-white mx-auto mb-3 shadow-lg shadow-brandPrimary/30">
                                {user.full_name ? user.full_name.charAt(0).toUpperCase() : user.username.charAt(0).toUpperCase()}
                            </div>
                            <h3 class="text-xl font-black text-white">{user.full_name || user.username}</h3>
                            <p class="text-xs text-brandCyan font-mono mt-0.5">@{user.username}</p>
                            <span class={`inline-block mt-2 px-3 py-1 rounded-full text-xs font-extrabold ${user.role === "admin" ? "bg-brandPrimary/20 text-brandPrimary border border-brandPrimary/30" : "bg-brandCyan/20 text-brandCyan border border-brandCyan/30"}`}>
                                {user.role === "admin" ? "👑 System Administrator" : "🎓 Student / Viewer"}
                            </span>
                        </div>

                        <div class="space-y-3 bg-white/5 p-4 rounded-2xl border border-white/10 text-xs mb-6">
                            <div class="flex justify-between items-center pb-2 border-b border-white/5">
                                <span class="text-gray-400 font-medium">Full Name</span>
                                <span class="font-bold text-white">{user.full_name || "—"}</span>
                            </div>
                            <div class="flex justify-between items-center pb-2 border-b border-white/5">
                                <span class="text-gray-400 font-medium">Username</span>
                                <span class="font-bold font-mono text-white">{user.username}</span>
                            </div>
                            <div class="flex justify-between items-center pb-2 border-b border-white/5">
                                <span class="text-gray-400 font-medium">Email Address</span>
                                <span class="font-bold text-white">{user.email || "—"}</span>
                            </div>
                            <div class="flex justify-between items-center pb-2 border-b border-white/5">
                                <span class="text-gray-400 font-medium">Department</span>
                                <span class="font-bold text-white">{user.department || "Computer Science & Engineering"}</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-gray-400 font-medium">User Role</span>
                                <span class="font-bold text-white uppercase">{user.role}</span>
                            </div>
                        </div>

                        <div class="flex items-center gap-3">
                            <button 
                                onClick={() => { onClose(); onLogout(); }} 
                                class="w-full py-2.5 bg-brandRed/15 hover:bg-brandRed/25 border border-brandRed/30 text-brandRed font-bold text-xs rounded-xl transition flex items-center justify-center gap-1.5"
                            >
                                <span>🚪 Sign Out</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Glassmorphic Authentication & Login Modal ---
        const AuthModal = ({ isOpen, onClose, onAuthSuccess }) => {
            if (!isOpen) return null;
            const [authMode, setAuthMode] = useState("login"); // "login" or "register"
            const [username, setUsername] = useState("");
            const [password, setPassword] = useState("");
            const [fullName, setFullName] = useState("");
            const [email, setEmail] = useState("");
            const [role, setRole] = useState("student");
            const [error, setError] = useState("");
            const [loading, setLoading] = useState(false);

            const handleQuickFill = (type) => {
                setError("");
                setAuthMode("login");
                if (type === "admin") {
                    setUsername("admin");
                    setPassword("admin123");
                } else {
                    setUsername("student");
                    setPassword("student123");
                }
            };

            const handleSubmit = async (e) => {

                                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>

                            </button>

        // --- Admin User Account Management Modal ---

            const [editingUser, setEditingUser] = useState(null);
            const [editFullName, setEditFullName] = useState("");
            const [editEmail, setEditEmail] = useState("");
            const [editRole, setEditRole] = useState("student");
            const [editDepartment, setEditDepartment] = useState("");
            const [editPassword, setEditPassword] = useState("");
            const [updating, setUpdating] = useState(false);

            const token = localStorage.getItem("vtu_auth_token") || "";

            const fetchUsers = async () => {
                setLoadingUsers(true);
                try {
                    const res = await fetch(`/api/admin/users?token=${encodeURIComponent(token)}`);
                    const data = await res.json();
                    if (res.ok) {
                        setUsers(data);
                    }
                } catch (e) {
                    console.error("Failed to load users:", e);
                } finally {
                    setLoadingUsers(false);
                }
            };

            useEffect(() => {
                if (isOpen) fetchUsers();
            }, [isOpen]);

            const handleCreateUser = async (e) => {
                e.preventDefault();
                setMsg({ type: "", text: "" });
                setCreating(true);

                try {
                    const res = await fetch(`/api/admin/users?token=${encodeURIComponent(token)}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            username,
                            password,
                            full_name: fullName,
                            email,
                            role,
                            department
                        })
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        throw new Error(data.detail || "Failed to create user account.");
                    }
                    setMsg({ type: "success", text: data.message || "User account created successfully!" });
                    setUsername("");
                    setPassword("");
                    setFullName("");
                    setEmail("");
                    setRole("student");
                    setDepartment("");
                    fetchUsers();
                } catch (err) {
                    setMsg({ type: "error", text: err.message });
                } finally {
                    setCreating(false);
                }

                setEditingUser(u);
                setEditFullName(u.full_name || "");
                setEditEmail(u.email || "");
                setEditRole(u.role || "student");
                setEditDepartment(u.department || "");
                setEditPassword("");
            };

            const handleUpdateUser = async (e) => {
                e.preventDefault();
                if (!editingUser) return;
                setUpdating(true);
                setMsg({ type: "", text: "" });

                try {
                    const res = await fetch(`/api/admin/users/${editingUser.id}?token=${encodeURIComponent(token)}`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            full_name: editFullName,
                            email: editEmail,
                            role: editRole,
                            department: editDepartment,
                            new_password: editPassword
                        })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || "Failed to update user account.");

                    setEditingUser(null);
                    fetchUsers();

                    setMsg({ type: "error", text: err.message });
                } finally {
                    setUpdating(false);

                setMsg({ type: "", text: "" });
                try {
                    const res = await fetch(`/api/admin/users/${userId}?token=${encodeURIComponent(token)}`, {

                    const data = await res.json();
                    if (!res.ok) {
                        throw new Error(data.detail || "Failed to delete user account.");

        // --- Main App Component ---
        const App = () => {
            // Theme state (Dark/Night mode vs Light/Day mode)
            const [theme, setTheme] = useState(() => {
                return localStorage.getItem("vtu_theme") || "dark";
            });

            useEffect(() => {
                document.body.className = theme === "dark" ? "dark-mode" : "light-mode";
                localStorage.setItem("vtu_theme", theme);
            }, [theme]);

            const toggleTheme = () => {
                setTheme(prev => (prev === "dark" ? "light" : "dark"));
            };

            // State configs
            const [portalUrl, setPortalUrl] = useState("https://results.vtu.ac.in/");
            const [useFastHttp, setUseFastHttp] = useState(true);
            const [autoSolveCaptcha, setAutoSolveCaptcha] = useState(true);
            const [sessionID, setSessionID] = useState(null);
            const [inputMode, setInputMode] = useState("range"); // range vs list
            const [startUsn, setStartUsn] = useState("");
            const [endUsn, setEndUsn] = useState("");
            const [usnList, setUsnList] = useState("");
            const [latStartUsn, setLatStartUsn] = useState("");
            const [latEndUsn, setLatEndUsn] = useState("");
            const [enableLatRange, setEnableLatRange] = useState(false);
            const [scrapingStatus, setScrapingStatus] = useState("idle"); // idle, scraping, completed, error
            const [logs, setLogs] = useState([]);
            const [progress, setProgress] = useState({ current: 0, total: 0, usn: "" });
            const [scrapedResults, setScrapedResults] = useState([]);
            const [captchaRequired, setCaptchaRequired] = useState(null); // { usn, captchaImg, attempt }
            const [captchaCode, setCaptchaCode] = useState("");
            const [isRefreshingCaptcha, setIsRefreshingCaptcha] = useState(false);
            const [apiKey, setApiKey] = useState(() => localStorage.getItem("vtu_api_key") || "");
            
            useEffect(() => {
                localStorage.setItem("vtu_api_key", apiKey);
            }, [apiKey]);
            const [analysisResults, setAnalysisResults] = useState(null);
            const [processedUsns, setProcessedUsns] = useState(new Set());
            
            // UI modal & navigation state
            const [showGuideModal, setShowGuideModal] = useState(false);
            const [showAboutModal, setShowAboutModal] = useState(false);
            const [showFeedbackModal, setShowFeedbackModal] = useState(false);
            const [activeTab, setActiveTab] = useState("directory"); // directory, subjects, toppers, backlogs
            const [searchTerm, setSearchTerm] = useState("");
            const [statusFilter, setStatusFilter] = useState("ALL");

            const wsRef = useRef(null);
            const captchaInputRef = useRef(null);

            // Auto-focus captcha entry field when it loads
            useEffect(() => {
                if (captchaRequired && captchaInputRef.current) {
                    captchaInputRef.current.focus();
                }
            }, [captchaRequired]);

            // User Authentication State
            const [user, setUser] = useState(() => {
                try {
                    const cached = localStorage.getItem("vtu_auth_user");
                    return cached ? JSON.parse(cached) : null;
                } catch (e) {
                    return null;
                }
            });
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [showUserMgmtModal, setShowUserMgmtModal] = useState(false);
            const [showHistoryModal, setShowHistoryModal] = useState(false);
            const [showProfileModal, setShowProfileModal] = useState(false);

            useEffect(() => {
                const token = localStorage.getItem("vtu_auth_token");
                if (token) {
                    fetch(`/api/auth/me?token=${encodeURIComponent(token)}`)
                        .then(res => res.json())
                        .then(data => {
                            if (data.authenticated && data.user) {
                                setUser(data.user);
                                localStorage.setItem("vtu_auth_user", JSON.stringify(data.user));
                            } else {
                                localStorage.removeItem("vtu_auth_token");
                                localStorage.removeItem("vtu_auth_user");
                                setUser(null);
                            }
                        })
                        .catch(() => {});
                }
            }, []);

            // Disable automatic browser scroll restoration and ensure window loads at the top
            useEffect(() => {
                if ('scrollRestoration' in window.history) {
                    window.history.scrollRestoration = 'manual';
                }
                window.scrollTo(0, 0);
            }, []);

            // Scroll to top whenever user authentication state changes
            useEffect(() => {
                if (user) {
                    window.scrollTo(0, 0);
                    if (document.documentElement) document.documentElement.scrollTop = 0;
                    if (document.body) document.body.scrollTop = 0;
                }
            }, [user]);

            const handleAuthSuccess = (userData, token) => {
                setUser(userData);
                setLogs(prev => [...prev, `[AUTH] Welcome, ${userData.full_name || userData.username}! Logged in as ${userData.role}.`]);
                window.scrollTo(0, 0);
                if (document.documentElement) document.documentElement.scrollTop = 0;
                if (document.body) document.body.scrollTop = 0;
            };

            const handleLogout = async () => {
                const token = localStorage.getItem("vtu_auth_token");
                if (token) {
                    fetch(`/api/auth/logout?token=${encodeURIComponent(token)}`, { method: "POST" }).catch(() => {});
                }
                localStorage.removeItem("vtu_auth_token");
                localStorage.removeItem("vtu_auth_user");
                setUser(null);
                setLogs(prev => [...prev, `[AUTH] Logged out successfully.`]);
                window.scrollTo(0, 0);
            };

            // Add starting log
            useEffect(() => {
                setLogs(["Result Scraping Portal is loaded and ready. Configure params and execute."]);
            }, []);

            // Connect & Start/Resume Scraper connection
            const handleConnectAndScrape = (isResume = false) => {
                if (!user) {
                    setShowAuthModal(true);
                    setLogs(prev => [...prev, "🔒 Authentication Required: Please log in or register to initiate scraping sessions."]);
                    return;
                }

                // Input validation
                if (inputMode === "range" && (!startUsn || !endUsn)) {
                    alert("Please input starting and ending USN numbers.");
                    return;
                }
                if (inputMode === "list" && !usnList) {
                    alert("Please input one or more comma-separated USNs.");
                    return;
                }

                if (!isResume) {
                    setScrapedResults([]);
                    setProcessedUsns(new Set());
                    setAnalysisResults(null);
                    setProgress({ current: 0, total: 0, usn: "" });
                }

                setCaptchaRequired(null);
                setScrapingStatus("scraping");
                
                const uuidSession = sessionID && isResume ? sessionID : ("sess-" + Math.random().toString(36).substring(2, 15));
                setSessionID(uuidSession);

                if (isResume) {
                    setLogs(prev => [
                        ...prev, 
                        `[RESUME] Re-establishing connection for session: ${uuidSession}`,
                        `[RESUME] Preserving ${scrapedResults.length} previously scraped student records...`,
                        `Connecting to scraper server...`
                    ]);
                } else {
                    setLogs(prev => [
                        ...prev, 
                        `[INIT] Generating new crawling session: ${uuidSession}`, 
                        `Connecting to scraper server...`
                    ]);
                }

                // Open WebSocket
                const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
                const wsUrl = `${protocol}//${window.location.host}/ws/scrape/${uuidSession}`;
                
                const ws = new WebSocket(wsUrl);
                wsRef.current = ws;

                ws.onopen = () => {
                    setLogs(prev => [...prev, `[SERVER] Connection established successfully.`]);
                    
                    let finalStart = startUsn;
                    let finalEnd = endUsn;
                    let finalUsnList = usnList;

                    if (inputMode === "range" && enableLatRange && latStartUsn && latEndUsn) {
                        finalUsnList = `${startUsn}-${endUsn}, ${latStartUsn}-${latEndUsn}`;
                        finalStart = "";
                        finalEnd = "";
                    }

                    // Send configs with resume parameters
                    const configPayload = {
                        auth_token: localStorage.getItem("vtu_auth_token") || "",
                        api_key: apiKey,
                        start_usn: inputMode === "range" && !finalUsnList ? finalStart : "",
                        end_usn: inputMode === "range" && !finalUsnList ? finalEnd : "",
                        usn_list: inputMode === "list" ? finalUsnList : (finalUsnList || ""),
                        portal_url: portalUrl,
                        use_fast_http: useFastHttp,
                        auto_solve_captcha: autoSolveCaptcha,
                        existing_results: isResume ? scrapedResults : [],
                        completed_usns: isResume ? Array.from(processedUsns) : [],
                        start_from_usn: isResume ? (progress.usn || "") : ""
                    };
                    ws.send(JSON.stringify(configPayload));
                };

                ws.onmessage = (event) => {
                    const msg = JSON.parse(event.data);
                    
                    if (msg.type === "log") {
                        setLogs(prev => [...prev, msg.message]);
                    } 
                    else if (msg.type === "status_update") {
                        setProgress({
                            current: msg.current,
                            total: msg.total,
                            usn: msg.usn
                        });
                        setLogs(prev => [...prev, `[SCRAPING] Loading results for ${msg.usn} (${msg.current}/${msg.total})`]);
                    }
                    else if (msg.type === "captcha_required") {
                        setLogs(prev => [...prev, `[CAPTCHA] Solver request for USN: ${msg.usn} (Attempt #${msg.attempt})`]);
                        setCaptchaRequired({
                            usn: msg.usn,
                            captchaImg: msg.captcha_img,
                            attempt: msg.attempt,
                            message: msg.message || ""
                        });
                        setCaptchaCode("");
                        setIsRefreshingCaptcha(false);
                    }
                    else if (msg.type === "progress") {
                        // Reset captcha modal if open
                        setCaptchaRequired(null);
                        
                        if (msg.usn) {
                            setProcessedUsns(prev => new Set(prev).add(msg.usn));
                        }

                        if (msg.status === "SUCCESS") {
                            setScrapedResults(prev => {
                                const exists = prev.some(s => s.usn === msg.data.usn);
                                return exists ? prev : [...prev, msg.data];
                            });
                        }
                        setLogs(prev => [...prev, msg.message]);
                    }
                    else if (msg.type === "completed") {
                        setScrapingStatus("completed");
                        setCaptchaRequired(null);
                        
                        if (msg.error) {
                            setLogs(prev => [...prev, `❌ ERROR: ${msg.error}`]);
                            setScrapingStatus("error");
                        } else {
                            setLogs(prev => [...prev, msg.message]);
                            setAnalysisResults(msg.analysis);
                        }
                        ws.close();
                    }
                    else if (msg.type === "error") {
                        setLogs(prev => [
                            ...prev, 
                            `❌ FATAL ERROR: ${msg.message}`,
                            `💡 Tip: Connection or server issue occurred. You can click 'Continue Crawling' to resume from USN: ${progress.usn || 'failed position'}.`
                        ]);
                        setScrapingStatus("error");
                        setCaptchaRequired(null);
                        ws.close();
                    }
                };

                ws.onerror = (err) => {
                    setLogs(prev => [
                        ...prev, 
                        `[ERROR] Connection failed. Scraper server may be offline.`,
                        `💡 Tip: You can click 'Continue Crawling' to resume from where connection failed.`
                    ]);
                    setScrapingStatus("error");
                };

                ws.onclose = () => {
                    console.log("WebSocket connection closed.");
                };
            };

            // Refresh Captcha image from server
            const handleRefreshCaptcha = () => {
                if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
                    setIsRefreshingCaptcha(true);
                    setLogs(prev => [...prev, `[CAPTCHA] Requesting fresh CAPTCHA image for USN: ${captchaRequired?.usn}...`]);
                    wsRef.current.send(JSON.stringify({ action: "refresh_captcha" }));
                }
            };

            // Submit Captcha response
            const handleCaptchaSubmit = (e) => {
                if (e) e.preventDefault();
                if (!captchaCode) return;
                
                if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
                    setLogs(prev => [...prev, `Submitting captcha code: "${captchaCode}"...`]);
                    wsRef.current.send(JSON.stringify({ captcha_code: captchaCode }));
                    setCaptchaRequired(null); // Close modal
                }
            };

            // Stop Scraper connection
            const handleStopScrape = () => {
                if (wsRef.current) {
                    wsRef.current.close();
                    setLogs(prev => [...prev, `⚠️ Scraper session cancelled by user.`]);
                    setScrapingStatus("idle");
                    setCaptchaRequired(null);
                }
            };

            // Filter data rows in Student Directory Tab
            const filteredResults = scrapedResults.filter(student => {
                const matchesSearch = student.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                     student.usn.toLowerCase().includes(searchTerm.toLowerCase());
                
                if (statusFilter === "ALL") return matchesSearch;
                if (statusFilter === "PASS") return matchesSearch && !student.status.includes("FAIL") && !student.status.includes("ABSENT") && student.status !== "AB";
                if (statusFilter === "FAIL") return matchesSearch && student.status.includes("FAIL");
                if (statusFilter === "ABSENT") return matchesSearch && (student.status.includes("ABSENT") || student.status === "AB");
                
                // Specific class filters
                return matchesSearch && student.status.includes(statusFilter);
            });

            // Mandatory Login Screen before accessing Home Screen
            if (!user) {
                return (
                    <LoginScreen 
                        onAuthSuccess={handleAuthSuccess} 
                        theme={theme} 
                        onToggleTheme={toggleTheme} 
                    />
                );
            }

            return (
                <div class="max-w-7xl mx-auto pb-16">
                    <Header 
                        status={scrapingStatus} 
                        theme={theme} 
                        onToggleTheme={toggleTheme} 
                        onOpenGuide={() => setShowGuideModal(true)}
                        onOpenAbout={() => setShowAboutModal(true)}
                        onOpenFeedback={() => setShowFeedbackModal(true)}
                        user={user}
                        onOpenAuthModal={() => setShowAuthModal(true)}
                        onLogout={handleLogout}
                        onOpenUserMgmt={() => setShowUserMgmtModal(true)}
                        onOpenHistory={() => setShowHistoryModal(true)}
                        onOpenProfile={() => setShowProfileModal(true)}
                    />
                    
                    {/* User Profile Details Modal */}
                    <ProfileModal 
                        isOpen={showProfileModal} 
                        onClose={() => setShowProfileModal(false)} 
                        user={user}
                        onLogout={handleLogout}
                    />

                    {/* Result Analysis History Modal */}
                    <HistoryModal 
                        isOpen={showHistoryModal} 
                        onClose={() => setShowHistoryModal(false)} 
                        user={user}
                    />

                    {/* Admin User Account Management Modal */}
                    <UserManagementModal 
                        isOpen={showUserMgmtModal} 
                        onClose={() => setShowUserMgmtModal(false)} 
                        user={user}
                    />

                    {/* Authentication Login Modal */}
                    <AuthModal 
                        isOpen={showAuthModal} 
                        onClose={() => setShowAuthModal(false)} 
                        onAuthSuccess={handleAuthSuccess}
                    />

                    {/* How to Use Guide Modal */}
                    <GuideModal isOpen={showGuideModal} onClose={() => setShowGuideModal(false)} />

                    {/* About Project Modal */}
                    <AboutModal isOpen={showAboutModal} onClose={() => setShowAboutModal(false)} />

                    {/* Feedback System Modal */}
                    <FeedbackModal isOpen={showFeedbackModal} onClose={() => setShowFeedbackModal(false)} />
                    
                    {/* Captcha Modal Overlay */}
                    {captchaRequired && (
                        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-md">
                            <div class="w-full max-w-md glass-panel-heavy p-6 rounded-3xl pulsing-border border text-center shadow-2xl">
                                <span class="inline-block px-3 py-1 bg-brandPrimary/10 border border-brandPrimary/20 rounded-full text-brandPrimary text-xs font-bold uppercase tracking-wider mb-2">
                                    Captcha Verification
                                </span>
                                <h3 class="text-xl font-bold text-white mb-1">Verify Seat Number</h3>
                                <p class="text-xs text-gray-400 mb-4">Solving captcha for student USN: <span class="text-brandCyan font-mono font-bold">{captchaRequired.usn}</span></p>

                                {captchaRequired.message && captchaRequired.attempt > 1 && (
                                    <div class="mb-4 p-3 bg-red-500/20 border border-red-500/40 rounded-xl flex items-center justify-center gap-2 text-xs text-red-300 font-bold animate-pulse">
                                        <svg class="w-4 h-4 text-red-400 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                                        </svg>
                                        <span>{captchaRequired.message}</span>
                                    </div>
                                )}
                                
                                <div class="flex flex-col items-center gap-3 p-4 bg-white/5 rounded-2xl border border-white/5 mb-6">
                                    <div class="relative flex items-center justify-center gap-3 bg-white p-2.5 rounded-xl border border-white/10 shadow-inner w-full">
                                        <img src={captchaRequired.captchaImg} alt="CAPTCHA Code" class="h-12 w-auto object-contain rounded" />
                                        <button 
                                            type="button" 
                                            onClick={handleRefreshCaptcha}
                                            disabled={isRefreshingCaptcha}
                                            title="Refresh CAPTCHA image"
                                            class="p-2 rounded-lg bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-700 transition flex items-center justify-center border border-gray-300 shadow-sm disabled:opacity-50"
                                        >
                                            <svg class={`w-5 h-5 text-gray-700 ${isRefreshingCaptcha ? 'animate-spin text-brandPrimary' : ''}`} fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                            </svg>
                                        </button>
                                    </div>
                                    <div class="flex items-center justify-between w-full text-[10px] px-1">
                                        <span class="text-brandSecondary font-medium">Attempt #{captchaRequired.attempt} of 4</span>
                                        <button 
                                            type="button" 
                                            onClick={handleRefreshCaptcha} 
                                            disabled={isRefreshingCaptcha}
                                            class="text-brandCyan hover:text-white font-semibold flex items-center gap-1 transition disabled:opacity-50"
                                        >
                                            <span>{isRefreshingCaptcha ? "Refreshing..." : "🔄 Refresh Captcha"}</span>
                                        </button>

                                </div>
                                
                                <form onSubmit={handleCaptchaSubmit} class="flex flex-col gap-4">

                                    <div class="flex gap-3">

                                        <button

                                        >
                                            Submit Code
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>

                                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />

                                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">VTU Results Target URL</label>
                                    <input 
                                        type="url" 
                                        value={portalUrl}
                                        onChange={(e) => setPortalUrl(e.target.value)}
                                        disabled={scrapingStatus === "scraping"}
                                        class="w-full bg-black/30 border border-white/5 focus:border-brandPrimary focus:outline-none rounded-xl px-4 py-2.5 text-sm text-gray-300 font-mono"
                                    />
                                </div>

                                {/* Scraper Options */}
                                <div class="mb-4">
                                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">Input Mode Selection</label>
                                    <div class="flex rounded-xl bg-black/40 border border-white/5 p-0.5">
                                        <button 
                                            type="button"

                                            disabled={scrapingStatus === "scraping"}
                                            class={`flex-1 py-2.5 text-center text-xs font-bold rounded-lg transition ${inputMode === "range" ? 'bg-brandPrimary text-white shadow' : 'text-gray-400 hover:text-white'}`}
                                        >
                                            USN Range Mode
                                        </button>
                                        <button

                                            onClick={() => setInputMode("list")}
                                            disabled={scrapingStatus === "scraping"}
                                            class={`flex-1 py-2.5 text-center text-xs font-bold rounded-lg transition ${inputMode === "list" ? 'bg-brandPrimary text-white shadow' : 'text-gray-400 hover:text-white'}`}
                                        >
                                            USN List Mode
                                        </button>
                                    </div>
                                </div>

                                 <hr class="border-white/5 mb-4" />
                                 {/* USN range inputs */}
                                {inputMode === "range" ? (
                                    <div class="space-y-4 mb-4">
                                        {/* Regular Entry USN Range */}
                                        <div>
                                            <div class="flex items-center justify-between mb-1.5">

                                            </div>
                                            <div class="grid grid-cols-2 gap-3">
                                                <div>
                                                    <input 
                                                        type="text"

                                                        value={startUsn}
                                                        onChange={(e) => setStartUsn(e.target.value.toUpperCase())}
                                                        disabled={scrapingStatus === "scraping"}
                                                        class="w-full bg-black/30 border border-white/10 focus:border-brandPrimary focus:outline-none rounded-xl px-4 py-2.5 text-sm text-white font-mono uppercase text-center font-bold"
                                                    />
                                                </div>
                                                <div>
                                                    <input 
                                                        type="text" 
                                                        placeholder="End e.g. 1SG21CS060"
                                                        value={endUsn}
                                                        onChange={(e) => setEndUsn(e.target.value.toUpperCase())}
                                                        disabled={scrapingStatus === "scraping"}
                                                        class="w-full bg-black/30 border border-white/10 focus:border-brandPrimary focus:outline-none rounded-xl px-4 py-2.5 text-sm text-white font-mono uppercase text-center font-bold"
                                                    />
                                                </div>
                                            </div>
                                        </div>

                                        {/* Lateral Entry Range Input Section */}
                                        <div class="p-3 bg-indigo-950/20 rounded-xl border border-indigo-500/20 space-y-2.5">
                                            <label class="flex items-center gap-2 cursor-pointer select-none">
                                                <input 
                                                    type="checkbox"
                                                    checked={enableLatRange}
                                                    onChange={(e) => setEnableLatRange(e.target.checked)}
                                                    disabled={scrapingStatus === "scraping"}
                                                    class="w-4 h-4 rounded border-gray-600 bg-black/40 text-brandCyan focus:ring-brandCyan"
                                                />
                                                <span class="text-xs font-bold text-brandCyan">Include Lateral Entry Range (Diploma 400-Series)</span>
                                            </label>

                                            {enableLatRange && (
                                                <div class="grid grid-cols-2 gap-3 pt-1">
                                                    <div>
                                                        <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Lateral Start USN</label>
                                                        <input 
                                                            type="text" 
                                                            placeholder="e.g. 1SG22CS400"
                                                            value={latStartUsn}
                                                            onChange={(e) => setLatStartUsn(e.target.value.toUpperCase())}
                                                            disabled={scrapingStatus === "scraping"}
                                                            class="w-full bg-black/40 border border-brandCyan/30 focus:border-brandCyan focus:outline-none rounded-xl px-3 py-2 text-xs text-white font-mono uppercase text-center font-bold"
                                                        />
                                                    </div>
                                                    <div>
                                                        <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Lateral End USN</label>
                                                        <input 
                                                            type="text" 
                                                            placeholder="e.g. 1SG22CS430"
                                                            value={latEndUsn}
                                                            onChange={(e) => setLatEndUsn(e.target.value.toUpperCase())}
                                                            disabled={scrapingStatus === "scraping"}
                                                            class="w-full bg-black/40 border border-brandCyan/30 focus:border-brandCyan focus:outline-none rounded-xl px-3 py-2 text-xs text-white font-mono uppercase text-center font-bold"
                                                        />
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ) : (
                                    <div class="mb-4">
                                        <div class="flex items-center justify-between mb-1.5">
                                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider">Target USN List / Ranges</label>
                                            <span class="text-[10px] text-brandCyan font-semibold">Supports Regular + Lateral Entry Ranges</span>
                                        </div>
                                        <textarea 
                                            placeholder="e.g. 4DM21CS001-060, 4DM22CS400-430"
                                            value={usnList}
                                            onChange={(e) => setUsnList(e.target.value.toUpperCase())}
                                            disabled={scrapingStatus === "scraping"}
                                            rows="3"
                                            class="w-full bg-black/30 border border-white/5 focus:border-brandPrimary focus:outline-none rounded-xl px-4 py-2.5 text-sm text-white font-mono uppercase scrollbar-thin resize-none"
                                        />
                                    </div>
                                )}
                            </div>

                            {/* Crawl Control CTAs */}
                            <div class="mt-8">
                                {scrapingStatus === "scraping" ? (
                                    <button 
                                        type="button" 
                                        onClick={handleStopScrape}
                                        class="w-full bg-gradient-to-r from-brandRed to-brandOrange rounded-xl py-3.5 text-sm font-bold text-white tracking-wider flex items-center justify-center gap-2 button-glow shadow-lg shadow-brandRed/20"
                                    >
                                        <svg class="w-5 h-5 animate-spin text-white" fill="none" viewBox="0 0 24 24">
                                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                        </svg>
                                        ABORT ACTIVE CRAWL
                                    </button>
                                ) : (scrapedResults.length > 0 || (progress.current > 0 && progress.current < progress.total)) ? (
                                    <div class="space-y-3">
                                        <div class="p-3.5 bg-amber-500/15 border border-amber-500/30 rounded-xl flex flex-col gap-1 text-xs">
                                            <div class="flex items-center justify-between font-bold text-amber-400">
                                                <span class="flex items-center gap-1.5">
                                                    <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                                                    <span>Connection / Session Interrupted</span>
                                                </span>
                                                <span class="text-[10px] px-2 py-0.5 bg-amber-500/20 rounded-full font-mono font-normal text-amber-300">
                                                    {progress.total > 0 ? `${progress.current}/${progress.total} Processed` : `${scrapedResults.length} Scraped`}
                                                </span>
                                            </div>
                                            <p class="text-[11px] text-gray-300 mt-0.5">
                                                Last active USN: <span class="font-mono font-bold text-brandCyan">{progress.usn || "N/A"}</span>. Click Continue to resume without losing {scrapedResults.length} scraped students.
                                            </p>
                                        </div>
                                        
                                        <button 
                                            type="button" 
                                            onClick={() => handleConnectAndScrape(true)}
                                            class="w-full bg-gradient-to-r from-brandGreen via-brandCyan to-brandPrimary rounded-xl py-3.5 text-sm font-bold text-white tracking-wider flex items-center justify-center gap-2 button-glow shadow-lg shadow-brandGreen/20 text-glow"
                                        >
                                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />

                                        </button>
                                        
                                        <button

                                            onClick={() => handleConnectAndScrape(false)}
